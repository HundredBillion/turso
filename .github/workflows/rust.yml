name: Normal recovery bootstrap validation
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  recovered-finalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90bdad780e3ba2651dc4859e4b0d7a9737518bb3
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact native source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 90bdad780e3ba2651dc4859e4b0d7a9737518bb3
          test "$(id -u)" -ne 0
          stat -f -c 'filesystem: %T (%t)' /tmp
          rustc -Vv
      - name: Actual normal recovery Ready and native ownership controls
        run: |
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api recovery_open_config -- --nocapture 2>&1 | tee config.log
          grep -q '5 passed; 0 failed' config.log
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_bootstrap_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee ready.log
          grep -q '14 passed; 0 failed' ready.log
      - name: Existing normal recovery and live Ready
        run: |
          for filter in checkpoint_recovery_finalize_native_ checkpoint_recovery_reclaim_native_ shared_checkpoint_ready_native_; do
            timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api "$filter" -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$filter.log"
          done
      - name: Full core library
        run: |
          timeout 900 cargo test --locked -p turso_core --lib --features conn_raw_api -- --test-threads=2 2>&1 | tee full-core.log
          grep -Eq 'test result: ok. [1-9][0-9]* passed; 0 failed' full-core.log
      - name: Strict library lint and source integrity
        run: |
          cargo clippy --locked -p turso_core --tests --features conn_raw_api,bench -- --deny=warnings 2>&1 | tee clippy.log
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-reclaim-stub
          path: '*.log'
