name: Controlled FTS fixture comparison
on:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config
      - name: Build exact variants and compare preserved fixture
        run: python3 scripts/validation/fts_fixed_fixture.py "$RUNNER_TEMP/fts-controlled"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fts-controlled-evidence
          path: ${{ runner.temp }}/fts-controlled/evidence
          retention-days: 14
