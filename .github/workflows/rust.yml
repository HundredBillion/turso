name: PHP simulator validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"
jobs:
  simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      matrix:
        profile:
          - name: WriteStress
            iterations: 4
            args: "--maximum-tests 1000 --min-tick 10 --max-tick 50 --profile write_stress --io-backend=memory"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup mold linker
        uses: "./.github/shared/setup-mold"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build simulator
        run: cargo build -p limbo_sim --bin limbo_sim --locked
      - name: Simulator ${{ matrix.profile.name }}
        env:
          SIM_ARGS: ${{ matrix.profile.args }}
        run: |
          set -euo pipefail
          seq 1 ${{ matrix.profile.iterations }} | xargs -P 4 -n 1 bash -c '
            i="$1"
            log="sim-run-$i.log"
            seed="$(od -An -N8 -tu8 /dev/urandom | tr -d "[:space:]")"
            echo "iteration $i starting: seed: $seed"
            read -r -a args <<< "$SIM_ARGS"
            if ./target/debug/limbo_sim "${args[@]}" --seed "$seed" >"$log" 2>&1; then
              echo "iteration $i ok: $(grep -m1 "^seed: " "$log")"
            else
              echo "iteration $i FAILED:"
              cat "$log"
              exit 255
            fi
          ' _
      - name: Upload simulator logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: simulator-${{ matrix.profile.name }}-${{ github.run_attempt }}
          path: sim-run-*.log
          if-no-files-found: ignore
          retention-days: 7

