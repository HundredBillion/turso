name: Prepared marker recovery token validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e0a84927e344b4040ee90a1c9fb7c956a312ff1d
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse --short=9 HEAD)" = e0a84927e
          rustc -Vv | tee rustc.txt
      - name: Manifest codec and publication checks
        run: |
          set -o pipefail
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api commit_manifest -- --test-threads=1 --nocapture 2>&1 | tee manifest-green.log
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api commit_manifest_downgrade_native -- --ignored --test-threads=1 --nocapture 2>&1 | tee fence-green.log
          grep -q '1 passed; 0 failed' fence-green.log
      - name: Bypassing intent fences must fail native admission control
        run: |
          cp core/mvcc/database/shared_runtime.rs /tmp/runtime-verified.rs
          cp core/mvcc/database/shared_refresh.rs /tmp/refresh-verified.rs
          python3 - <<'PYCODE'
          for p in ['core/mvcc/database/shared_runtime.rs','core/mvcc/database/shared_refresh.rs']:
              s=open(p).read()
              guard='loaded.record().requires_recovery()'
              assert s.count(guard)==1
              s=s.replace(guard,'loaded.record().checkpoint_intent().is_some()')
              open(p,'w').write(s)
          PYCODE
          set +e
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api commit_manifest_downgrade_native -- --ignored --test-threads=1 --nocapture 2>&1 | tee fence-negative.log
          status=${PIPESTATUS[0]}
          set -e
          cp /tmp/runtime-verified.rs core/mvcc/database/shared_runtime.rs
          cp /tmp/refresh-verified.rs core/mvcc/database/shared_refresh.rs
          test "$status" -ne 0
          grep -q '0 passed; 1 failed' fence-negative.log
          grep -q 'assertion failed' fence-negative.log
      - name: Restored exact source passes
        run: |
          git diff --exit-code
          set -o pipefail
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api commit_manifest_downgrade_native -- --ignored --test-threads=1 --nocapture 2>&1 | tee fence-restored.log
          grep -q '1 passed; 0 failed' fence-restored.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downgrade-intent-proof
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
