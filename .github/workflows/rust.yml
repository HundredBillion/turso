name: Cache application comparison screening
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build same-path upstream, current fork and candidate controls
        run: python3 scripts/build_cache_application_controls.py
      - name: Compare immutable application requests and Redis cache paths
        run: >-
          python3 scripts/run_cache_application_probe.py
          --binary upstream=application-results/binaries/upstream
          --binary fork=application-results/binaries/fork
          --binary candidate=application-results/binaries/candidate
          --output application-results/screening
          --rows 1000 --requests 2000 --workers 1,8,32 --rates 0,2000 --repeats 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-application-results
          path: application-results/
          retention-days: 14
