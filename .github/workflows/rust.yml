name: Static JSON traversal experiment
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: static-json-traversal
          cache-on-failure: true
      - name: Verify JSON semantics
        env:
          QUICKCHECK_TESTS: "500"
        run: >-
          cargo test --locked -p turso_core --lib json:: -- --test-threads=1
      - name: Compare current main and both extraction variants
        run: python3 scripts/diagnose_json_canonical.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-json-traversal-results
          path: canonical-results/
          retention-days: 14
