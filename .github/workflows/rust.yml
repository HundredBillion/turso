name: Shared RELEASE cap lifecycle validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 87db73608181fc6cb8692ba7dd4e6069c0ddcc95
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 87db73608181fc6cb8692ba7dd4e6069c0ddcc95
          rustc -Vv | tee rustc.txt
      - name: RELEASE reset must fail before preservation hook
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_release_cap_busy -- --test-threads=1 --nocapture 2>&1 | tee release-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q '0 passed; 1 failed' release-red.log
          grep -q 'cap Busy discarded RELEASE transaction' release-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-release-red
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
