name: Shared synchronous prepare retirement validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  prepare-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b21428dff093b0b9669464186d3b40545930eafd
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact native source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = b21428dff093b0b9669464186d3b40545930eafd
          test "$(id -u)" -ne 0
          stat -f -c 'filesystem: %T (%t)' /tmp
          rustc -Vv
      - name: Checkpoint pause excludes idle root prepare
        run: |
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_prepare_native_idle_root_respects_checkpoint_pause -- --ignored --test-threads=1 --nocapture 2>&1 | tee pause.log
          grep -q '1 passed; 0 failed' pause.log
      - name: Missing logical read pins must fail actual retirement control
        run: |
          set +e
          timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api shared_prepare_io_native_no_result_until_manifest_and_logical_backend_retire -- --ignored --test-threads=1 --nocapture 2>&1 | tee logical-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'logical: prepare returned before physical retirement' logical-red.log
          grep -q '0 passed; 1 failed' logical-red.log
      - name: Source integrity
        run: |
          cargo fmt --all --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-prepare-retirement
          path: |
            source.txt
            *.log
