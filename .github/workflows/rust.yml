name: Shared downgrade preparation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
defaults:
  run:
    shell: bash
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f455230bf47c089f5513aa8544acc2e58ede0ec
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 2f455230bf47c089f5513aa8544acc2e58ede0ec
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Native ordinary locks and exact downgrade regression
        run: |
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api linux_ordinary_lock_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee ordinary-locks.log
          grep '^test result:' ordinary-locks.log | tail -1 | grep -q '^test result: ok. 4 passed; 0 failed;'
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_marker_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee marker.log
          grep '^test result:' marker.log | tail -1 | grep -q '^test result: ok. 5 passed; 0 failed;'
      - name: Unsupported-lock destructor causal control
        run: |
          cp core/io/unix.rs /tmp/unix-accepted.rs
          trap 'cp /tmp/unix-accepted.rs core/io/unix.rs' EXIT
          python3 - <<'PYCONTROL'
          from pathlib import Path
          p = Path('core/io/unix.rs')
          s = p.read_text()
          before = '#[cfg(not(all(target_os = "linux", target_pointer_width = "64")))]\nimpl Drop for UnixFile'
          assert s.count(before) == 1
          p.write_text(s.replace(before, 'impl Drop for UnixFile'))
          PYCONTROL
          set +e
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api linux_ordinary_lock_native_unsupported_lock_drops_safely -- --ignored --test-threads=1 --nocapture > unsupported-control.log 2>&1
          code=$?
          set -e
          cat unsupported-control.log
          test "$code" -ne 0
          grep '^test result:' unsupported-control.log | tail -1 | grep -q '^test result: FAILED. 0 passed; 1 failed;'
          grep -q 'Failed to unlock file' unsupported-control.log
          cp /tmp/unix-accepted.rs core/io/unix.rs
          git diff --exit-code
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api linux_ordinary_lock_native_unsupported_lock_drops_safely -- --ignored --test-threads=1 --nocapture 2>&1 | tee unsupported-restored.log
          grep '^test result:' unsupported-restored.log | tail -1 | grep -q '^test result: ok. 1 passed; 0 failed;'
      - name: Broader ordinary core and SDK contracts
        run: |
          timeout 900 cargo test --locked -p turso_core --lib --features conn_raw_api,bench -- --test-threads=2 2>&1 | tee core.log
          grep '^test result:' core.log | tail -1 | grep -Eq '^test result: ok. [1-9][0-9]* passed; 0 failed;'
          timeout 600 cargo test --locked -p turso_sdk_kit --lib -- --test-threads=2 2>&1 | tee sdk.log
          grep '^test result:' sdk.log | tail -1 | grep -Eq '^test result: ok. [1-9][0-9]* passed; 0 failed;'
      - name: Actual io_uring lock ownership
        run: |
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api,io_uring linux_ordinary_lock_native_uring_alias_cache_and_sigkill -- --ignored --test-threads=1 --nocapture 2>&1 | tee uring-locks.log
          grep '^test result:' uring-locks.log | tail -1 | grep -q '^test result: ok. 1 passed; 0 failed;'
      - name: Strict library lint and formatting
        run: |
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench,io_uring -- -D warnings 2>&1 | tee clippy.log
          cargo fmt --all --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-downgrade-preparation
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
            *status.txt
            *summary.txt
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f455230bf47c089f5513aa8544acc2e58ede0ec
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-windows
          cache-on-failure: true
      - run: cargo check --locked -p turso_core --lib --features conn_raw_api
