name: Sustained mixed-write cache comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify screening binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 42268556981 --repo HundredBillion/turso --json conclusion --jq .conclusion)" = success
          gh run download 42268556981 --repo HundredBillion/turso --name mixed-cache-comparison --dir mixed-controls
          chmod +x mixed-controls/binaries/upstream mixed-controls/binaries/fork mixed-controls/binaries/candidate
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          p=Path('mixed-controls');m=json.loads((p/'build-metadata.json').read_text())
          assert m['fixture_revision']=='8a14bdb01d8d19475c1a10dca3161f857e74453b'
          for name,expected in m['binaries'].items():
              assert hashlib.sha256((p/'binaries'/name).read_bytes()).hexdigest()==expected['sha256'],name
          for name,expected in m['fixture_sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          PYCODE
      - name: Compare thirty-second mixed-write trials
        run: >-
          python3 scripts/run_cache_mixed_probe.py
          --binary upstream=mixed-controls/binaries/upstream
          --binary fork=mixed-controls/binaries/fork
          --binary candidate=mixed-controls/binaries/candidate
          --output sustained-results
          --rows 1000 --requests 60000 --workers 8 --rate 2000
          --write-every 20 --checkpoint-every 200
          --deployments embedded,shared --cache false,true --repeats 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sustained-mixed-cache-results
          path: |
            sustained-results/
            mixed-controls/build-metadata.json
            mixed-controls/cpuinfo.txt
          retention-days: 14
