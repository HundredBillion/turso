name: Shared downgrade preparation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
defaults:
  run:
    shell: bash
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 725139ac8faa902df0a770ceb000b2b9e2461ab3
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 725139ac8faa902df0a770ceb000b2b9e2461ab3
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Merged live marker controls
        run: |
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_marker_native_ -- --ignored --skip old_handle_close --test-threads=1 --nocapture 2>&1 | tee marker-merged.log
          grep -q '^test result: ok. 3 passed; 0 failed;' marker-merged.log
      - name: Observe old-handle lock exclusion
        run: |
          set +e
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_marker_native_old_handle_close_preserves_ordinary_lock -- --ignored --test-threads=1 --nocapture 2>&1 | tee old-handle-probe.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > lock-probe-status.txt
          test "$code" = 0 -o "$code" = 101
          summary=$(sed -n '/^test result:/p' old-handle-probe.log | tail -n1)
          echo "$summary" > lock-probe-summary.txt
          echo "$summary" | grep -Eq '(1 passed; 0 failed|0 passed; 1 failed)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-downgrade-preparation
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
            *status.txt
            *summary.txt
          retention-days: 14
