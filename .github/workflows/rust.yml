name: Prepared marker recovery token validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6f1083925f20c5e78e850ee63a52e249d6b5c2b8
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse --short=9 HEAD)" = 6f1083925
          rustc -Vv | tee rustc.txt
      - name: Native cleanup proof checks
        run: |
          set -o pipefail
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api staging_cleanup -- --test-threads=1 --nocapture 2>&1 | tee cleanup-green.log
          grep -q '4 passed; 0 failed' cleanup-green.log
      - name: Removing identity and raw-path proofs must fail controls
        run: |
          cp core/mvcc/mode_transition/staging_cleanup.rs /tmp/cleanup-verified.rs
          python3 - <<'PYCODE'
          p='core/mvcc/mode_transition/staging_cleanup.rs'
          s=open(p).read()
          line='        require_identity(&self.path, identity(file)?)?;'
          assert s.count(line)==1
          s=s.replace(line,'')
          raw='let mut wal = staging.as_os_str().to_owned();'
          assert s.count(raw)==1
          s=s.replace(raw,'let wal = format!("{}-wal", staging.display());')
          s=s.replace('        wal.push("-wal");','')
          open(p,'w').write(s)
          PYCODE
          set +e
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api staging_cleanup -- --test-threads=1 --nocapture 2>&1 | tee cleanup-negative.log
          status=${PIPESTATUS[0]}
          set -e
          cp /tmp/cleanup-verified.rs core/mvcc/mode_transition/staging_cleanup.rs
          test "$status" -ne 0
          grep -q '2 passed; 2 failed' cleanup-negative.log
          grep -q 'unwrap_err()' cleanup-negative.log
          grep -q 'raw-name staging WAL was orphaned' cleanup-negative.log
      - name: Restored exact source passes
        run: |
          git diff --exit-code
          set -o pipefail
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api staging_cleanup -- --test-threads=1 --nocapture 2>&1 | tee cleanup-restored.log
          grep -q '4 passed; 0 failed' cleanup-restored.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-cleanup-green
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
