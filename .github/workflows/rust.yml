name: Current generation native integration cohort
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native-current-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3942c92fc97654b389541f49821cb7623fcf4a27
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Verify exact source and native integrations
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 3942c92fc97654b389541f49821cb7623fcf4a27
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_opcode_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee shared_id_opcode_native.log
          grep -q '13 passed; 0 failed' shared_id_opcode_native.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_watermark_io_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee shared_watermark_io_native.log
          grep -q '1 passed; 0 failed' shared_watermark_io_native.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_lifecycle_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee shared_id_lifecycle_native.log
          grep -q '8 passed; 0 failed' shared_id_lifecycle_native.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_lifecycle_io_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee shared_id_lifecycle_io_native.log
          grep -q '2 passed; 0 failed' shared_id_lifecycle_io_native.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_prepare_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee shared_prepare_native.log
          grep -q '3 passed; 0 failed' shared_prepare_native.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_prepare_io_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee shared_prepare_io_native.log
          grep -q '1 passed; 0 failed' shared_prepare_io_native.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_stale_prepare_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee shared_id_stale_prepare_native.log
          grep -q '1 passed; 0 failed' shared_id_stale_prepare_native.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_watermark_identity_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee shared_watermark_identity_native.log
          grep -q '1 passed; 0 failed' shared_watermark_identity_native.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_schema_publication_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee shared_schema_publication_native.log
          grep -q '3 passed; 0 failed' shared_schema_publication_native.log
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idle-generation-native-cohort-3942
          path: |
            source.txt
            *.log
