name: Shared downgrade preparation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
defaults:
  run:
    shell: bash
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6fb3409f18d4a1822da8f10b430489b42df97fd
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = b6fb3409f18d4a1822da8f10b430489b42df97fd
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Fresh terminal recovery and prior native controls
        run: |
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_resume_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee resume.log
          grep -q '^test result: ok. 1 passed; 0 failed;' resume.log
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_creation_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee creation.log
          grep -q '^test result: ok. 2 passed; 0 failed;' creation.log
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_prepare_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee preparation.log
          grep -q '^test result: ok. 7 passed; 0 failed;' preparation.log
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_marker_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee marker.log
          grep -q '^test result: ok. 4 passed; 0 failed;' marker.log
      - name: Strict library lint and formatting
        run: |
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee clippy.log
          cargo fmt --all --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-downgrade-preparation
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
            *status.txt
            *summary.txt
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6fb3409f18d4a1822da8f10b430489b42df97fd
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-windows
          cache-on-failure: true
      - run: cargo check --locked -p turso_core --lib --features conn_raw_api
