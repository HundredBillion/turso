name: Private shared ID opcode regression
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  ids:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e6fbaa2b1aa9be95ace5da9857e16c44419e0ef
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source
        run: |
          git rev-parse HEAD | tee source.txt
          rustc -Vv | tee rustc.txt
      - name: Existing allocators must expose cross-instance collisions
        run: |
          set +e
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_opcode_native -- --ignored --test-threads=1 --nocapture 2>&1 | tee ids-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'independent stores allocated the same live rowid' ids-red.log
          grep -q "allocator ignored a peer's live explicit key" ids-red.log
          grep -q 'test result: FAILED' ids-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-id-opcode-regression
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
