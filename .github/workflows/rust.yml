name: Shared ID namespace native validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a39704eb479823b9b49d7104d25a8b9757ea710
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source and native environment
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 3a39704eb479823b9b49d7104d25a8b9757ea710
          test "$(id -u)" -ne 0
          stat -f -c 'workspace filesystem: %T (%t)' .
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
          rustc -Vv | tee rustc.txt
      - name: Existing incarnation must not bypass persisted ID validation
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_open_native_validates_ids_when_incarnation_is_already_ready -- --ignored --test-threads=1 --nocapture 2>&1 | tee ready-ids-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'live authority readiness bypassed durable ID validation' ready-ids-red.log
          grep -q '0 passed; 1 failed' ready-ids-red.log
      - name: Preserve exact source and expected failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-id-namespace-validation
          path: |
            source.txt
            rustc.txt
            *.log
            *.patch
          retention-days: 14
