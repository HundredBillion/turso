name: Selected current ID base validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-id-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6b91c7382df98c429a12b88fab89f84805c0066a
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Record exact source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 6b91c7382df98c429a12b88fab89f84805c0066a
          rustc -Vv | tee rustc.txt
      - name: Idle old process and new constructor reload current generation
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_idle_generation_native_reloads_after_checkpoint_and_later_commits -- --ignored --test-threads=1 --nocapture 2>&1 | tee idle-process-green.log
          grep -q '1 passed; 0 failed' idle-process-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_idle_generation_native_cancel_partial_replay_then_retry_latest -- --ignored --test-threads=1 --nocapture 2>&1 | tee idle-cancel-green.log
          grep -q '1 passed; 0 failed' idle-cancel-green.log
      - name: Current base evidence and existing ID protocol
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api id_current_base_ -- --test-threads=1 --nocapture 2>&1 | tee current-base-green.log
          grep -q '4 passed; 0 failed' current-base-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api current_base_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee physical-base-green.log
          grep -q '3 passed; 0 failed' physical-base-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api current_local_install_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee local-install-green.log
          grep -q '2 passed; 0 failed' local-install-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_generation_ -- --include-ignored --test-threads=1 2>&1 | tee generation-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api mvcc::shared_ids:: -- --test-threads=1 2>&1 | tee id-protocol-green.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-current-local-install-c963
          path: |
            source.txt
            rustc.txt
            '*green.log'
