name: Checkpoint recovery entry native validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 46df3a19e5e927e722aaab230a97b8dc727049a4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = "$(git rev-parse 46df3a19e5e927e722aaab230a97b8dc727049a4)"
          test "$(id -u)" -ne 0
          stat -f -c '%T %t' . /tmp
      - name: Paused checkpoint recovery selection
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_entry_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee recovery-green.log
          grep -q '3 passed; 0 failed' recovery-green.log
      - name: Native same-process snapshot ownership negative control
        run: |
          cp core/mvcc/shared_authority.rs /tmp/shared-authority-original.rs
          python3 - <<'PYCONTROL'
          from pathlib import Path
          p = Path('core/mvcc/shared_authority.rs')
          s = p.read_text()
          start = s.index('    pub(super) fn ensure_no_snapshot_locks')
          end = s.index('    fn visit_live_registrations', start)
          part = s[start:end]
          old = 'if *locally_owned\n                || !self.authority.file.shared_wal_try_lock_byte('
          assert part.count(old) == 1
          part = part.replace(old, 'if !self.authority.file.shared_wal_try_lock_byte(')
          part = part.replace('(slot, locally_owned)', '(slot, _locally_owned)')
          p.write_text(s[:start] + part + s[end:])
          PYCONTROL
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api authority_retains_live_snapshots_and_reclaims_dead_process_slots -- --test-threads=1 --nocapture > local-slot-red.log 2>&1
          result=$?
          set -e
          cp /tmp/shared-authority-original.rs core/mvcc/shared_authority.rs
          cat local-slot-red.log
          test "$result" -ne 0
          grep -q '0 passed; 1 failed' local-slot-red.log
          grep -q 'guard.ensure_no_snapshot_locks()' local-slot-red.log
          cargo test --locked -p turso_core --lib --features conn_raw_api authority_retains_live_snapshots_and_reclaims_dead_process_slots -- --test-threads=1 --nocapture 2>&1 | tee local-slot-restored.log
          grep -q '1 passed; 0 failed' local-slot-restored.log
          git diff --exit-code -- core/mvcc/shared_authority.rs
      - name: Existing manifest cancellation and authority boundaries
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api commit_manifest::tests:: -- --test-threads=1 --nocapture 2>&1 | tee manifest.log
          grep -Eq '[1-9][0-9]* passed; 0 failed' manifest.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_authority::tests:: -- --test-threads=1 --nocapture 2>&1 | tee authority.log
          grep -Eq '[1-9][0-9]* passed; 0 failed' authority.log
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-coordinator-native
          path: |
            source.txt
            *.log
