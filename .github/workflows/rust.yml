name: Native C URI shared mode adapter
on:
  workflow_dispatch:
    inputs:
      engine:
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.engine }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact source
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          test "$(git rev-parse HEAD)" = "$ENGINE"
          test "$(id -u)" -ne 0
          stat -f -c '%T %t' . /tmp
      - name: Actual C URI entry
        run: |
          cargo test --locked -p turso_sqlite3 --lib shared_mvcc_uri_native_ -- --ignored --test-threads=1 2>&1 | tee shared-uri.log
          grep -q '1 passed; 0 failed' shared-uri.log
      - name: Ordinary C units and compatibility
        run: |
          cargo test --locked -p turso_sqlite3 --lib -- --test-threads=2 2>&1 | tee c-units.log
          grep -Eq '[1-9][0-9]* passed; 0 failed' c-units.log
          cargo test --locked -p turso_sqlite3 --test compat -- --test-threads=2 2>&1 | tee c-compat.log
          grep -Eq '[1-9][0-9]* passed; 0 failed' c-compat.log
      - name: Core and C lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p turso_core -p turso_sqlite3 --all-targets --features turso_core/conn_raw_api,turso_core/bench,turso_core/io_uring -- -D warnings 2>&1 | tee lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-c-uri-evidence
          path: '*.log'
