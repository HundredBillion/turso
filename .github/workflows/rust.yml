name: Shared VDBE admission and journal mode validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  vdbe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1927c9ae05f9a77d50b95dcdfc0c32f4e5a1723
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source and native environment
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = d1927c9ae05f9a77d50b95dcdfc0c32f4e5a1723
          test "$(id -u)" -ne 0
          stat -f -c 'workspace filesystem: %T (%t)' .
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
          rustc -Vv | tee rustc.txt
      - name: Native VDBE admission and journal mode
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_ -- --test-threads=1 --nocapture 2>&1 | tee native-green.log
          grep -q '4 passed; 0 failed' native-green.log
      - name: VDBE ordinary behavior and native controls
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api vdbe -- --test-threads=1 2>&1 | tee vdbe.log
          cargo test --locked -p turso_core --lib --features conn_raw_api journal_mode -- --test-threads=1 2>&1 | tee journal.log
      - name: Strict core library lint
        run: |
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee clippy.log
      - name: Preserve exact source and controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-vdbe-native-green
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
