name: Recovery Store continuation native integration
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  physical-wal-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 198914e3ef213ea03805dca8d6e82550ef705732
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Actual committed physical WAL recovery
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 198914e3ef213ea03805dca8d6e82550ef705732
          uname -a | tee environment.txt
          rustc --version | tee -a environment.txt
          stat -f -c '%T %t' . | tee -a environment.txt
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_store_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee owned-carrier-green.log
          grep -q '8 passed; 0 failed' owned-carrier-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_ -- --ignored --skip physical_wal_peer_child --list 2>&1 | tee recovery-test-list.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_ -- --ignored --skip physical_wal_peer_child --test-threads=1 --nocapture 2>&1 | tee recovery-continuation-green.log
          python3 - <<'CHECK'
          import re
          names=[x for x in open('recovery-test-list.log') if x.rstrip().endswith(': test')]
          assert len(names)>50,len(names)
          rows=re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored',open('recovery-continuation-green.log').read())
          assert rows and rows[-1]==(str(len(names)),'0','0'),(len(names),rows[-3:])
          print('FINAL_RECOVERY_PARENT',rows[-1])
          CHECK
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-physical-wal-green
          path: |
            *.txt
            *.log
