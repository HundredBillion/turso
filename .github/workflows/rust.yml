name: Shared physical connection native validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 784b38afc2ddfae50bd25e7f9f9a6ee98490a37d
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 784b38afc2ddfae50bd25e7f9f9a6ee98490a37d
          test "$(id -u)" -ne 0
          stat -f -c '%T %t' . /tmp
      - name: Private physical connection plumbing and completed image
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_physical_connection_ -- --test-threads=1 --nocapture 2>&1 | tee physical-portable.log
          grep -q '3 passed; 0 failed' physical-portable.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_physical_connection_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee physical-native.log
          grep -q '1 passed; 0 failed' physical-native.log
      - name: Native coordinator publication and bounded quiescence
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_coordinator_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee coordinator-green.log
          grep -q '3 passed; 0 failed' coordinator-green.log
      - name: Completion and ID finalization failure boundaries
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_completion_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee completion.log
          grep -q '3 passed; 0 failed' completion.log
          cargo test --locked -p turso_core --lib --features conn_raw_api id_checkpoint_finalize_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee finalization.log
          grep -q '3 passed; 0 failed' finalization.log
      - name: Lease retention and private shared components
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api guarded_file:: -- --test-threads=1 --nocapture 2>&1 | tee guarded.log
          grep -q '15 passed; 0 failed' guarded.log
          grep -q 'process_ofd_lock_survives_abort_until_backend_retirement ... ok' guarded.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_ -- --test-threads=1 --nocapture 2>&1 | tee shared.log
          grep -Eq '[1-9][0-9]* passed; 0 failed' shared.log
      - name: Native materialization opening and commit regression
        run: |
          for selector in shared_checkpoint_native_ shared_open_native shared_commit_native_; do
            cargo test --locked -p turso_core --lib --features conn_raw_api "$selector" -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$selector.log"
            grep -q '2 passed; 0 failed' "$selector.log"
          done
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-coordinator-native
          path: |
            source.txt
            *.log
