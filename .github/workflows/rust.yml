name: Shared schema publication audit
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d82be999aa783d88e6856ed6cb523981d1c3f6b4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = d82be999aa783d88e6856ed6cb523981d1c3f6b4
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Genuine installed checkpoint preparation expected RED
        run: |
          set -o pipefail
          set +e
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_prepare_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee downgrade-red.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" = 101
          grep -q '0 passed; 1 failed' downgrade-red.log
          grep -q 'genuine installed checkpoint must prepare downgrade intent' downgrade-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-downgrade-preparation
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
            *status.txt
          retention-days: 14
