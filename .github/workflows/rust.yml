name: Fork PHP storage validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-php-storage-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: 1
  CC_x86_64_pc_windows_msvc: cl.exe
jobs:
  storage:
    if: github.repository == 'HundredBillion/turso'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            core_features: io_memory_yield
            test_features: io_memory_yield
            sync_features: turso_core/io_memory_yield
          - os: windows-2025
            core_features: io_memory_yield,experimental_win_iocp
            test_features: io_memory_yield,win_iocp
            sync_features: turso_core/io_memory_yield,turso_core/experimental_win_iocp
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Source identity
        run: >-
          git log -2 --format=fuller
      - name: Observed storage authority
        run: >-
          cargo test --locked -p turso_core --lib --features "${{ matrix.core_features }}" database::readonly::tests -- --test-threads=1
      - name: Read-only filesystem contract
        run: >-
          cargo test --locked -p turso_core --lib --features "${{ matrix.core_features }}" io::filesystem_open_tests:: -- --test-threads=1
      - name: Header lifecycle and activation failures
        run: >-
          cargo test --locked -p core_tester --features "${{ matrix.test_features }}" --test integration_tests storage::header_version -- --test-threads=1
      - name: PostgreSQL legacy read-only opening
        run: >-
          cargo test --locked -p turso_pg_tests --features "${{ matrix.test_features }}" --test integration_tests test_postgres_refuses_a_database_file_whose_tables_are_in_no_schema -- --nocapture
      - name: Sync and SDK regressions
        run: >-
          cargo test --locked -p turso_sync_engine --features "${{ matrix.sync_features }}" --lib
      - name: Build fresh C library
        run: >-
          cargo build --locked -p turso_sqlite3 --lib
      - name: C compatibility on Linux
        if: runner.os == 'Linux'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
        run: >-
          cargo test --locked -p turso_sqlite3 --test compat -- --test-threads=1
      - name: C compatibility on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$(Resolve-Path target/debug);$env:PATH"
          cargo test --locked -p turso_sqlite3 --test compat -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PHP storage and callbacks with stock SQLite and fresh Turso
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 sqlite3
          probe_dir=$(mktemp -d)
          sqlite3 "$probe_dir/control.db" 'CREATE TABLE sample(x); INSERT INTO sample VALUES(1);'
          cp "$probe_dir/control.db" "$probe_dir/candidate.db"
          cp "$probe_dir/control.db" "$probe_dir/legacy-template.db"
          php .github/scripts/php-storage-probe.php sqlite "$probe_dir/control.db" "$probe_dir/legacy-template.db"
          mkdir "$probe_dir/lib"
          ln -s "$PWD/target/debug/libturso_sqlite3.so" "$probe_dir/lib/libsqlite3.so.0"
          sha256sum target/debug/libturso_sqlite3.so
          LD_LIBRARY_PATH="$probe_dir/lib:$PWD/target/debug" php .github/scripts/php-storage-probe.php turso "$probe_dir/candidate.db" "$probe_dir/legacy-template.db"
      - name: Core with actual Shuttle instrumentation
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: --cfg tokio_unstable --cfg shuttle
        run: >-
          cargo test --locked -p turso_core --lib shuttle_ -- --test-threads=1
