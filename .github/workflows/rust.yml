name: Shared checkpoint physical staging native validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  physical-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1d21a1c0bde48843b675cab914c28cc137162102
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and native environment
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 1d21a1c0bde48843b675cab914c28cc137162102
          test "$(id -u)" -ne 0
          stat -f -c 'workspace filesystem: %T (%t)' .
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
          rustc -Vv | tee rustc.txt
      - name: Store-independent physical facts and unchanged bootstrap
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api mvcc::database::shared_bootstrap -- --test-threads=1 --nocapture 2>&1 | tee facts-green.log
          grep -q '4 passed; 0 failed' facts-green.log
      - name: Existing completed publication coordinator
        run: |
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_coordinator_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee coordinator-green.log
          grep -q '3 passed; 0 failed' coordinator-green.log
      - name: Live physical staging and delayed read retirement
        run: |
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_physical_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee physical-staging-green.log
          grep -q '3 passed; 0 failed' physical-staging-green.log
      - name: Verified generation and pager components
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_generation_reload -- --test-threads=1 2>&1 | tee generation-prep.log
          grep -q '3 passed; 0 failed' generation-prep.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_generation_reset_ -- --test-threads=1 2>&1 | tee pager.log
          grep -q '7 passed; 0 failed' pager.log
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_generation_reload_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee generation-native.log
          grep -q '2 passed; 0 failed' generation-native.log
      - name: Reclaim and install without admission release
        run: |
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_install_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee local-install-green.log
          grep -q '6 passed; 0 failed' local-install-green.log
      - name: Missing certified readiness publication must fail
        run: |
          set +e
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_ready_native_resumes_original_connection_and_new_commits -- --ignored --test-threads=1 --nocapture 2>&1 | tee ready-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'completed checkpoint readiness publication is not implemented' ready-red.log
          grep -q '0 passed; 1 failed' ready-red.log
      - name: Strict library lint and source integrity
        run: |
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee lint.log
          cargo fmt --all --check
          git diff --exit-code
      - name: Preserve exact source and expected failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-physical-staging-validation
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
