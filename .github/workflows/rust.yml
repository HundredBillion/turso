name: Explicit offline operator
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab55ac39096114d78cafdc7d8fc670e0c8f2b275
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact non-test executable
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = ab55ac39096114d78cafdc7d8fc670e0c8f2b275
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
          cargo build --locked -p turso_cli --bin tursodb 2>&1 | tee build.log
          sha256sum target/debug/tursodb | tee binary-sha256.txt
          target/debug/tursodb --version | tee version.txt
          ldd target/debug/tursodb | tee libraries.txt
      - name: Reject before mutation
        run: |
          python3 testing/cli_tests/shared_offline.py --binary target/debug/tursodb --case no-write 2>&1 | tee no-write.log
          grep -q '"result": "passed"' no-write.log
      - name: Genuine closed-worker downgrade expected RED
        run: |
          set +e
          python3 testing/cli_tests/shared_offline.py --binary target/debug/tursodb --case roundtrip > roundtrip.log 2>&1
          status=$?
          set -e
          echo "$status" | tee roundtrip-status.txt
          test "$status" -eq 1
          grep -q 'offline downgrade orchestration is not implemented' roundtrip.log
          grep -q '1|after' roundtrip.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-offline-operator
          path: |
            *.log
            *.txt
          retention-days: 14
