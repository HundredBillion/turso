name: Recovered checkpoint logical reclamation validation
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  recovered-finalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0c6390c7c90dae52292f99580830d7d7516b75c2
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact native source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 0c6390c7c90dae52292f99580830d7d7516b75c2
          test "$(id -u)" -ne 0
          stat -f -c 'filesystem: %T (%t)' /tmp
          rustc -Vv
      - name: Existing recovered finalization prerequisites
        run: |
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_finalize_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee finalized.log
          grep -q '7 passed; 0 failed' finalized.log
      - name: Genuine logical reclamation stub RED
        run: |
          set +e
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_reclaim_native_fresh_log_without_admission -- --ignored --test-threads=1 --nocapture 2>&1 | tee stub-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'recovered logical reclamation is not implemented' stub-red.log
          grep -q '0 passed; 1 failed' stub-red.log
      - name: Existing runtime accepts an unsafe second Store RED
        run: |
          set +e
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_reclaim_native_rejects_second_store -- --ignored --test-threads=1 --nocapture 2>&1 | tee ownership-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'a second Store attached to an already claimed runtime' ownership-red.log
          grep -q '0 passed; 1 failed' ownership-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-reclaim-stub
          path: '*.log'
