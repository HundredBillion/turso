name: Direct SQLite offline upgrade counterexamples
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2190b36a5ce4fef4db42e5f7f91c7038ffc069a
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Actual direct SQLite upgrade counterexamples
        run: |
          git rev-parse HEAD | tee source.txt
          rustc -Vv | tee rustc.txt
          cargo build --locked -p turso_cli --bin tursodb 2>&1 | tee build.log
          for case in stock-delete stock-wal; do
            set +e
            python3 testing/cli_tests/shared_offline.py --binary target/debug/tursodb --case "$case" > "$case.log" 2>&1
            status=$?
            set -e
            test "$status" -eq 1
            grep -q 'offline backend initially requires ordinary MVCC mode' "$case.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-sqlite-upgrade-red
          path: |
            *.log
            source.txt
            rustc.txt
