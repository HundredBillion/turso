name: Interrupted checkpoint intent mirror GREEN
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  intent-native-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cddbf1f0eac28bc2a8b449a32cbb2809087f2938
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Genuine coordinator crash fixture prerequisite
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = cddbf1f0eac28bc2a8b449a32cbb2809087f2938
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_intent_native_crash_fixtures_keep_acknowledged_source -- --ignored --test-threads=1 --nocapture 2>&1 | tee crash-fixture-green.log
          grep -q '1 passed; 0 failed' crash-fixture-green.log
      - name: Mirror actual intent without readiness
        run: |
          set -euo pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_intent_native_mirrors_actual_crashed_selection -- --ignored --test-threads=1 --nocapture 2>&1 | tee intent-mirror-green.log
          grep -q '1 passed; 0 failed' intent-mirror-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_intent_native_two_full_syncs_before_owner -- --ignored --test-threads=1 --nocapture 2>&1 | tee intent-full-sync-green.log
          grep -q '1 passed; 0 failed' intent-full-sync-green.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interrupted-intent-mirror-green-cddbf1f0e
          path: |
            source.txt
            *.log
