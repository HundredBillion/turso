name: Actual source ID facts and allocation seeding
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  physical-wal-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4f6d6a5ace367b49dbe6be703d88f13a09107bb
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Actual committed physical WAL recovery
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = a4f6d6a5ace367b49dbe6be703d88f13a09107bb
          uname -a | tee environment.txt
          rustc --version | tee -a environment.txt
          stat -f -c '%T %t' . | tee -a environment.txt
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_ids_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee source-ids-green.log
          grep -q '1 passed; 0 failed' source-ids-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_store_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee source-store-controls.log
          grep -q '8 passed; 0 failed' source-store-controls.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_intent_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee source-intent-controls.log
          grep -q '9 passed; 0 failed' source-intent-controls.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-physical-wal-green
          path: |
            *.txt
            *.log
