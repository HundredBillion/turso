name: Shared ID namespace native validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eac0d6bc24ded8476cfcea460de18172c32d7dbe
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source and native environment
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = eac0d6bc24ded8476cfcea460de18172c32d7dbe
          test "$(id -u)" -ne 0
          stat -f -c 'workspace filesystem: %T (%t)' .
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
          rustc -Vv | tee rustc.txt
      - name: Concrete native offline upgrade and exclusion
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api offline_backend_ -- --test-threads=1 --nocapture 2>&1 | tee offline-green.log
          grep -q '3 passed; 0 failed' offline-green.log
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee lint.log
      - name: Preserve exact source and expected failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-id-namespace-validation
          path: |
            source.txt
            rustc.txt
            *.log
            *.patch
          retention-days: 14
