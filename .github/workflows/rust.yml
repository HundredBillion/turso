name: Shared constructor checkpoint pause regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-constructor-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05b67c74dee07d53e4c8ca82f107bf2ed0412d4b
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Record exact source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 05b67c74dee07d53e4c8ca82f107bf2ed0412d4b
          rustc -Vv | tee rustc.txt
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
      - name: Current constructor must violate paused admission
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_connection_native_pause_rejects_connection_before_header_io -- --ignored --test-threads=1 --nocapture 2>&1 | tee pause-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q '0 passed; 1 failed' pause-red.log
          grep -q 'a paused checkpoint admitted a new shared connection' pause-red.log
      - name: Preserve exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-constructor-05b67-red
          path: |
            source.txt
            rustc.txt
            pause-red.log
