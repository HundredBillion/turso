name: Shared ID namespace native validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02af09c92a599a5912c3d055836fd5958a590c3c
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source and native environment
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 02af09c92a599a5912c3d055836fd5958a590c3c
          test "$(id -u)" -ne 0
          stat -f -c 'workspace filesystem: %T (%t)' .
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
          rustc -Vv | tee rustc.txt
      - name: Fresh initialization creates its required sidecars
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api offline_backend_initializes_and_publishes_fresh_database_without_replacement -- --test-threads=1 --nocapture 2>&1 | tee fresh-green.log
          grep -q '1 passed; 0 failed' fresh-green.log
      - name: Self-aliasing staging path must reproduce unwanted file creation
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api offline_backend_rejects_main_log_alias_before_creating -- --test-threads=1 --nocapture 2>&1 | tee alias-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'self-aliasing staging database was created' alias-red.log
          grep -q '0 passed; 1 failed' alias-red.log
      - name: Preserve exact source and expected failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-id-namespace-validation
          path: |
            source.txt
            rustc.txt
            *.log
            *.patch
          retention-days: 14
