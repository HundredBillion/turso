name: Checkpoint recovery entry expected RED
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dcf015e12691b6f206933c0d9c04883a1f1a6cf6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = "$(git rev-parse dcf015e12691b6f206933c0d9c04883a1f1a6cf6)"
          test "$(id -u)" -ne 0
          stat -f -c '%T %t' . /tmp
      - name: Verify missing recovery entry at genuine intent
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_entry_native_ -- --ignored --test-threads=1 --nocapture > recovery-red.log 2>&1
          result=$?
          set -e
          cat recovery-red.log
          test "$result" -ne 0
          grep -q 'checkpoint recovery selection is not implemented' recovery-red.log
          grep -q '0 passed; 1 failed' recovery-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-coordinator-native
          path: |
            source.txt
            *.log
