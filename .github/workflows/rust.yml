name: Physical WAL exclusion RED
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  physical-owner-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3148fa59eb316c332b59f5c00fc0459ef3a08a65
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Missing physical exclusion behavior
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 3148fa59eb316c332b59f5c00fc0459ef3a08a65
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api physical_wal_recovery_native_owns_all_slots_until_drop -- --ignored --test-threads=1 --nocapture > physical-owner-red.log 2>&1
          code=$?
          set -e
          cat physical-owner-red.log
          test "$code" -ne 0
          grep -q '0 passed; 1 failed' physical-owner-red.log
          grep -q 'physical WAL recovery exclusion is not implemented' physical-owner-red.log
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-owner-red
          path: |
            source.txt
            *.log
