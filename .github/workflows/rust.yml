name: Shared schema publication audit
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c75b8e35cc3efdf0b9d08a5b53fc733c2352849
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 5c75b8e35cc3efdf0b9d08a5b53fc733c2352849
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Independent worker conflict and restart audits
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api --no-run 2>&1 | tee build.log
          status=0
          for selector in shared_worker_native_update_conflicts shared_worker_native_delete_conflicts shared_worker_native_unique_conflicts shared_worker_native_snapshot_multirow_ack_and_rolling_restart; do
            set +e
            timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api "$selector" -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$selector.log"
            code=${PIPESTATUS[0]}
            set -e
            if test "$code" != 0 || ! grep -q '1 passed; 0 failed' "$selector.log"; then status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-worker-acceptance-audit
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
            *status.txt
          retention-days: 14
