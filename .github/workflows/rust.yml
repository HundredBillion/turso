name: Shared VDBE native admission regression validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  vdbe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 807b48ad447c272cfd9df4b07c9d53aea9eb4944
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source and native environment
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 807b48ad447c272cfd9df4b07c9d53aea9eb4944
          test "$(id -u)" -ne 0
          stat -f -c 'workspace filesystem: %T (%t)' .
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
          rustc -Vv | tee rustc.txt
      - name: Native admission barrier and reset retirement
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_ -- --skip journal_mode --test-threads=1 --nocapture 2>&1 | tee admission-green.log
          grep -q '2 passed; 0 failed' admission-green.log
      - name: Journal mode marker regression must fail before fix
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_journal_mode -- --test-threads=1 --nocapture 2>&1 | tee journal-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q '0 passed; 1 failed' journal-red.log
          grep -q 'Invalid read_version: 254' journal-red.log
      - name: Admission bypass negative control
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('core/vdbe/execute.rs')
          source = path.read_text()
          before = 'if mv_store.is_shared() {\n        return mv_store.begin_shared_nonblock('
          assert source.count(before) == 1
          path.write_text(source.replace(before, 'if false && mv_store.is_shared() {\n        return mv_store.begin_shared_nonblock('))
          PYCODE
          git diff > bypass.patch
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_fresh_read_and_savepoint -- --test-threads=1 --nocapture 2>&1 | tee admission-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q '0 passed; 1 failed' admission-red.log
          grep -q 'shared fresh admission bypassed publication barrier' admission-red.log
      - name: Restore route and recheck
        run: |
          git checkout -- core/vdbe/execute.rs
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_ -- --skip journal_mode --test-threads=1 --nocapture 2>&1 | tee admission-restored.log
          grep -q '2 passed; 0 failed' admission-restored.log
      - name: Preserve exact source and controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-vdbe-native-controls
          path: |
            source.txt
            rustc.txt
            *.log
            bypass.patch
          retention-days: 14
