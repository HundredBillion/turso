name: Shared watermark full native acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba3c6d0bf659497f2c4625c8c967ea9638c09506
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = ba3c6d0bf659497f2c4625c8c967ea9638c09506
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Build exact native tests
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api --no-run 2>&1 | tee build.log
      - name: Native ID and watermark gates
        run: |
          set -o pipefail
          timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_opcode_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee ids-native.log
          grep -q '13 passed; 0 failed' ids-native.log
          for selector in shared_watermark_identity_native_ shared_watermark_io_native_ shared_watermark_process_native_; do
            timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api "$selector" -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$selector.log"
            grep -q '1 passed; 0 failed' "$selector.log"
          done
      - name: Reset hook causal control and restored acceptance
        run: |
          set -o pipefail
          python3 -c 'from pathlib import Path; p=Path("core/vdbe/mod.rs"); s=p.read_text(); old="self.shared_watermark.reset();"; assert s.count(old)==1; p.write_text(s.replace(old,"/* validation-only omitted watermark reset */"))'
          trap 'git restore -- core/vdbe/mod.rs' EXIT
          git diff -- core/vdbe/mod.rs > reset-negative.diff
          cargo test --locked -p turso_core --lib --features conn_raw_api --no-run 2>&1 | tee reset-negative-build.log
          set +e
          timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api shared_watermark_io_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee reset-negative.log
          negative_status=${PIPESTATUS[0]}
          set -e
          git restore -- core/vdbe/mod.rs
          trap - EXIT
          test "$negative_status" -eq 101
          grep -q '0 passed; 1 failed' reset-negative.log
          grep -q 'retired read retained ownership' reset-negative.log
          cargo test --locked -p turso_core --lib --features conn_raw_api --no-run 2>&1 | tee reset-restored-build.log
          timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api shared_watermark_io_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee reset-restored.log
          grep -q '1 passed; 0 failed' reset-restored.log
          git diff --exit-code
      - name: Policy ordinary sequences and lint
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api id_policy_ 2>&1 | tee policy.log
          grep -q '12 passed; 0 failed' policy.log
          cargo test --locked -p turso_core --lib --features conn_raw_api sequence -- --test-threads=2 2>&1 | tee sequences.log
          grep -q 'test_sequence_watermark_tracks_nextval_allocations ... ok' sequences.log
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-watermark-full
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
          retention-days: 14
