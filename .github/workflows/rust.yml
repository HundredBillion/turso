name: Shared checkpoint coordinator native validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9464d47442b667def9f7ff4c7413aa7f028258cc
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 9464d47442b667def9f7ff4c7413aa7f028258cc
          test "$(id -u)" -ne 0
          stat -f -c '%T %t' . /tmp
      - name: Coordinator missing implementation must fail
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_coordinator_native_publishes_target_without_reclaiming_log -- --ignored --test-threads=1 --nocapture 2>&1 | tee coordinator-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q '0 passed; 1 failed' coordinator-red.log
          grep -q 'shared checkpoint coordinator is not implemented' coordinator-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-coordinator-native
          path: |
            source.txt
            *.log
