name: SDK codec ownership diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf6140a36601770206e790e3c1f330bb029a8fe2
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Focused ownership
        run: |
          git rev-parse HEAD | tee source.txt
          rustc -Vv | tee rustc.txt
          cargo test --locked -p turso_sdk_kit --lib page_codec_is_applied_to_sdk_connections -- --nocapture 2>&1 | tee focused.log
      - name: Full SDK ownership
        if: always()
        run: |
          cargo test --locked -p turso_sdk_kit --lib -- --nocapture 2>&1 | tee sdk.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-codec-ownership
          path: |
            *.log
            source.txt
            rustc.txt
