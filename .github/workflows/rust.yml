name: Full preserved JSON suite comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified static traversal and baseline executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42257719725 --repo HundredBillion/turso --name static-json-traversal-results --dir static-inputs
      - name: Alternate full JSON suite on one host
        run: python3 scripts/compare_json_full_preserved.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-preserved-json-results
          path: full-json-results/
          retention-days: 14
