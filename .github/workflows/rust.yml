name: Shared ID cleanup capacity validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1c79786e44886ced3e62868ac41f66bb002a1322
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact source and native filesystem
        run: |
          test "$(git rev-parse HEAD)" = "1c79786e44886ced3e62868ac41f66bb002a1322"
          test "$(id -u)" -ne 0
          stat -f -c '%T %t' . /tmp
      - name: Journal capacity and existing protocols
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api mvcc::shared_ids -- --test-threads=1 2>&1 | tee protocol.log
          grep -q '75 passed; 0 failed; 3 ignored' protocol.log
      - name: Native allocation and sequence watermarks
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_opcode_native_ -- --ignored --test-threads=1 2>&1 | tee ids.log
          grep -q '13 passed; 0 failed' ids.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_watermark_ -- --ignored --skip shared_watermark_process_child --test-threads=1 2>&1 | tee watermark.log
          grep -q '3 passed; 0 failed' watermark.log
      - name: MVCC regression suite and lint
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api mvcc::database:: -- --test-threads=2 2>&1 | tee mvcc.log
          grep -Eq '[1-9][0-9]* passed; 0 failed' mvcc.log
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee lint.log
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: id-cleanup-capacity
          path: '*.log'
