name: Interrupted checkpoint intent mirror GREEN
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  intent-native-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e72b821af8347283cce1d16e4d8dd566fd0e3888
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Actual intent mirroring and native failure boundaries
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = e72b821af8347283cce1d16e4d8dd566fd0e3888
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_intent_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee intent-native-green.log
          grep -q '6 passed; 0 failed' intent-native-green.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interrupted-intent-mirror-green-e72b821af
          path: |
            source.txt
            *.log
