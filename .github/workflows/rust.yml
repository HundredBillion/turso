name: Source ID read failure and retirement ownership
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  physical-wal-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 38923e94e568025f2cee9b5f50b64057ae7b9b42
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Actual committed physical WAL recovery
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 38923e94e568025f2cee9b5f50b64057ae7b9b42
          uname -a | tee environment.txt
          rustc --version | tee -a environment.txt
          stat -f -c '%T %t' . | tee -a environment.txt
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_ids_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee source-ids-io-green.log
          grep -q '3 passed; 0 failed' source-ids-io-green.log
          python3 - <<'CONTROL'
          from pathlib import Path
          p=Path('core/mvcc/shared_ids/io_protocol.rs')
          s=p.read_text()
          old='            let completion = Completion::new_read(buffer.clone(), move |result| {\n                let _keep_alive = (&ownership, &pin);'
          new='            drop(ownership);\n            drop(pin);\n            let completion = Completion::new_read(buffer.clone(), move |result| {'
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new))
          CONTROL
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_ids_io_native_cancel_keeps_authority_through_backend_retirement -- --ignored --test-threads=1 --nocapture 2>&1 | tee source-ids-retirement-control-red.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -q 'test result: FAILED. 0 passed; 1 failed' source-ids-retirement-control-red.log
          grep -q 'assertion failed: matches!' source-ids-retirement-control-red.log
          git checkout -- core/mvcc/shared_ids/io_protocol.rs
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_ids_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee source-ids-io-restored-green.log
          grep -q '3 passed; 0 failed' source-ids-io-restored-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_store_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee source-store-controls.log
          grep -q '8 passed; 0 failed' source-store-controls.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-physical-wal-green
          path: |
            *.txt
            *.log
