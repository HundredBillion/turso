name: Shared schema publication audit
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6faf5d5a16c5c9059272da516f60f15357a65f63
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 6faf5d5a16c5c9059272da516f60f15357a65f63
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Native overlapping schema commit audit
        run: |
          set -o pipefail
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_schema_publication_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee schema.log
          grep -q '2 passed; 0 failed' schema.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-schema-publication-audit
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
