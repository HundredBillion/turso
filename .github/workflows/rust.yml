name: Committed physical WAL recovery GREEN
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  physical-wal-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 073e3565aaf0a2258a0dfff8a15e2db76b83c5c4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Actual committed physical WAL recovery
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 073e3565aaf0a2258a0dfff8a15e2db76b83c5c4
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_wal_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee physical-wal-green.log
          grep -q '4 passed; 0 failed' physical-wal-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api physical_wal_recovery_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee physical-owner-regression-green.log
          grep -q '8 passed; 0 failed' physical-owner-regression-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_intent_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee intent-regression-green.log
          grep -q '9 passed; 0 failed' intent-regression-green.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-physical-wal-green
          path: |
            source.txt
            *.log
