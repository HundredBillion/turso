name: Source IDs genuine missing-behavior reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  physical-wal-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e46e031d5e1020a60a3a00a14baf7612a54cefc7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Actual committed physical WAL recovery
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = e46e031d5e1020a60a3a00a14baf7612a54cefc7
          uname -a | tee environment.txt
          rustc --version | tee -a environment.txt
          stat -f -c '%T %t' . | tee -a environment.txt
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_ids_native_genuine_source_seeds_actual_floor_without_publication -- --ignored --test-threads=1 --nocapture 2>&1 | tee source-ids-missing.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -q 'test result: FAILED. 0 passed; 1 failed' source-ids-missing.log
          grep -q 'source ID inspection is not implemented' source-ids-missing.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-physical-wal-green
          path: |
            *.txt
            *.log
