name: Normal recovery bootstrap validation
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  recovered-finalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b507c9a0cd60dcfc95f2300b6eb5112ff0fa9350
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact native source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = b507c9a0cd60dcfc95f2300b6eb5112ff0fa9350
          test "$(id -u)" -ne 0
          stat -f -c 'filesystem: %T (%t)' /tmp
          rustc -Vv
      - name: Existing recovered finalization prerequisites
        run: |
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_finalize_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee finalized.log
          grep -q '7 passed; 0 failed' finalized.log
      - name: Recovered logical reclamation and ownership
        run: |
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_reclaim_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee reclaim.log
          grep -q '9 passed; 0 failed' reclaim.log
      - name: Existing constructor pager and remote generation cohorts
        run: |
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api shared_connection_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee constructor.log
          grep -q '6 passed; 0 failed' constructor.log
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api shared_pager_generation_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee pager.log
          grep -q '1 passed; 0 failed' pager.log
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api shared_idle_generation_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee idle.log
          grep -q '4 passed; 0 failed' idle.log
      - name: Completed witness and full core union
        run: |
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_confirmation_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee witness.log
          grep -q '8 passed; 0 failed' witness.log
          timeout 900 cargo test --locked -p turso_core --lib --features conn_raw_api -- --test-threads=1 2>&1 | tee core.log
          grep -Eq 'test result: ok. [1-9][0-9]* passed; 0 failed' core.log
      - name: Strict library lint and source integrity
        run: |
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- --deny=warnings 2>&1 | tee clippy.log
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-reclaim-stub
          path: '*.log'
