name: Committed physical WAL recovery RED
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  physical-wal-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2c0ff89aff3359f652952bbb372d1b8362e9130f
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Genuine committed WAL fixtures then missing recovery
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 2c0ff89aff3359f652952bbb372d1b8362e9130f
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_wal_native_crash_fixtures_cover_old_partial_and_synced_main -- --ignored --test-threads=1 --nocapture 2>&1 | tee physical-wal-fixtures-green.log
          grep -q '1 passed; 0 failed' physical-wal-fixtures-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_intent_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee intent-regression-green.log
          grep -q '9 passed; 0 failed' intent-regression-green.log
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_wal_native_restores_committed_image_without_completion_or_admission -- --ignored --test-threads=1 --nocapture > physical-wal-missing-red.log 2>&1
          code=$?
          set -e
          cat physical-wal-missing-red.log
          test "$code" -ne 0
          grep -q '0 passed; 1 failed' physical-wal-missing-red.log
          grep -q 'committed physical WAL recovery is not implemented' physical-wal-missing-red.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-physical-wal-red
          path: |
            source.txt
            *.log
