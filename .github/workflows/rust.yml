name: Fork cross-process MVCC validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-mvcc-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  authority:
    if: github.repository == 'HundredBillion/turso'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Source identity
        run: git log -2 --format=fuller
      - name: Linux authority and process lifetime
        run: >-
          cargo test --locked -p turso_core --lib mvcc::shared_authority::tests -- --test-threads=1 --nocapture
      - name: Committed-prefix replay
        run: >-
          cargo test --locked -p turso_core --lib --features conn_raw_api committed_prefix -- --test-threads=1
      - name: Durable manifest and cancellation ownership
        run: >-
          cargo test --locked -p turso_core --lib --features conn_raw_api mvcc::commit_manifest::tests -- --test-threads=1 --nocapture
