name: Shared ID savepoint regression
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9698edf3f031439d201008dda4c685310756ae81
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 9698edf3f031439d201008dda4c685310756ae81
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Build exact native tests
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api --no-run 2>&1 | tee build.log
      - name: Native scoped ID lifecycle
        run: |
          set -o pipefail
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_lifecycle_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee lifecycle.log
          grep -q '7 passed; 0 failed' lifecycle.log
          timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_opcode_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee ids-native.log
          grep -q '13 passed; 0 failed' ids-native.log
      - name: Existing named rollback and ID policy
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api named_savepoint 2>&1 | tee named-regressions.log
          cargo test --locked -p turso_core --lib --features conn_raw_api id_policy_ 2>&1 | tee policy.log
          grep -q '12 passed; 0 failed' policy.log
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-id-statement-release
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
          retention-days: 14
