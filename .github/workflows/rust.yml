name: Fork concurrency validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-concurrency-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1
  CC_x86_64_pc_windows_msvc: cl.exe

jobs:
  storage:
    if: github.repository == 'HundredBillion/turso'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
      - name: Shared coordination
        run: >-
          cargo test --locked -p turso_core --lib storage::shared_wal_coordination::tests -- --test-threads=1
      - name: Independent process paths
        run: >-
          cargo test --locked -p turso_core --lib multiprocess_tests:: -- --test-threads=1
      - name: Page initialization and delayed close
        run: >-
          cargo test --locked -p turso_core --lib --features io_memory_yield allocate_page1_tests -- --nocapture
      - name: Registry options
        run: >-
          cargo test --locked -p core_tester --test integration_tests registry_db_opts -- --nocapture
      - name: Reported Windows timeout case
        timeout-minutes: 10
        run: >-
          cargo test --locked -p core_tester --test integration_tests failed_commit_with_materialized_view_leaves_no_rows_behind -- --nocapture
      - name: Large shared index with independent reader
        timeout-minutes: 10
        run: >-
          cargo test --locked -p turso_core --lib multiprocess_tests::subprocess_reopened_writer_grows_shared_index_with_old_reader -- --ignored --exact --test-threads=1
      - name: Sync protocol and ownership
        run: >-
          cargo test --locked -p turso_sync_engine --lib
