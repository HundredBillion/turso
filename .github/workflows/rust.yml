name: Private shared ID opcode regression
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  ids:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67babeb2dd79766ad50d15b92d1036103ade0302
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source
        run: |
          git rev-parse HEAD | tee source.txt
          rustc -Vv | tee rustc.txt
      - name: Native ID opcode integration
        run: |
          set -o pipefail
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_opcode_native -- --ignored --test-threads=1 --nocapture 2>&1 | tee ids-green.log
          grep -q '5 passed; 0 failed' ids-green.log
      - name: Strict library lint
        run: |
          set -o pipefail
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-id-opcode-regression
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
