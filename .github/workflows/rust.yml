name: Shared downgrade preparation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
defaults:
  run:
    shell: bash
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 237a662edea1287bc287fbd85bfb7085544f1859
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 237a662edea1287bc287fbd85bfb7085544f1859
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Actual process recovery dispatcher
        run: |
          for pair in resume:4 partial:4 cleanup:2 creation:2 extent:1 marker:5; do
            kind="${pair%:*}"; count="${pair#*:}"
            timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api,bench,io_uring "shared_downgrade_${kind}_native_" -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$kind.log"
            grep '^test result:' "$kind.log" | tail -1 | grep -q "^test result: ok. $count passed; 0 failed;"
          done
      - name: Causal control omits dispatcher cleanup
        run: |
          cp core/mvcc/mode_transition/operation.rs /tmp/operation.good.rs
          python3 - <<'PYCONTROL'
          from pathlib import Path
          p=Path('core/mvcc/mode_transition/operation.rs')
          s=p.read_text()
          old='super::downgrade_resume::resume_marker(path, history_limit, prerequisite)?.cleanup()'
          assert s.count(old)==1
          s=s.replace(old,'let _completed = super::downgrade_resume::resume_marker(path, history_limit, prerequisite)?; Ok(())')
          old='super::downgrade_cleanup::resume_cleanup(path, prerequisite)'
          assert s.count(old)==1
          s=s.replace(old,'let _ = (path, prerequisite); Ok(())')
          p.write_text(s)
          PYCONTROL
          git diff > omitted-cleanup.diff
          for kind in resume partial; do
            set +e
            timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api,bench,io_uring "shared_downgrade_${kind}_native_sigkill_" -- --ignored --test-threads=1 --nocapture > "control-$kind.log" 2>&1
            status=$?
            set -e
            echo "$status" > "control-$kind-status.txt"
            test "$status" -eq 101
            grep '^test result:' "control-$kind.log" | tail -1 | grep -q '^test result: FAILED. 0 passed; 1 failed;'
          done
          cp /tmp/operation.good.rs core/mvcc/mode_transition/operation.rs
          git diff --exit-code
          for kind in resume partial; do
            timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api,bench,io_uring "shared_downgrade_${kind}_native_sigkill_" -- --ignored --test-threads=1 --nocapture 2>&1 | tee "restored-$kind.log"
            grep '^test result:' "restored-$kind.log" | tail -1 | grep -q '^test result: ok. 1 passed; 0 failed;'
          done
      - name: Strict library lint and formatting
        run: |
          cargo clippy --locked -p turso_core --lib --tests --features conn_raw_api,bench,io_uring -- -D warnings 2>&1 | tee clippy.log
          cargo fmt --all --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-downgrade-preparation
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
            *status.txt
            *summary.txt
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 237a662edea1287bc287fbd85bfb7085544f1859
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-windows
          cache-on-failure: true
      - run: cargo check --locked -p turso_core --lib --features conn_raw_api
