name: Shared constructor checkpoint pause regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-constructor-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5b799477a477309e63356cd63cc894a6d273d979
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Record exact source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 5b799477a477309e63356cd63cc894a6d273d979
          rustc -Vv | tee rustc.txt
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
      - name: Initial open must expose missing backend-retirement wait
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_connection_native_initial_open_waits_for_completed_header_backend_release -- --ignored --test-threads=1 --nocapture 2>&1 | tee bootstrap-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q '0 passed; 1 failed' bootstrap-red.log
          grep -q 'initial open did not wait for completed header backend release' bootstrap-red.log
      - name: Preserve exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-bootstrap-5b799-red
          path: |
            source.txt
            rustc.txt
            bootstrap-red.log
