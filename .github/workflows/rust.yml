name: Normal recovery bootstrap validation
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  recovered-finalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 350dc66fa120845594bb55d60e1360dc9dc50acd
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact native source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 350dc66fa120845594bb55d60e1360dc9dc50acd
          test "$(id -u)" -ne 0
          stat -f -c 'filesystem: %T (%t)' /tmp
          rustc -Vv
      - name: Affected concrete poll and default evidence ownership
        run: |
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_reclaim_native_log_rejects_changed_evidence -- --ignored --test-threads=1 --nocapture 2>&1 | tee affected-poll.log
          grep -q '1 passed; 0 failed' affected-poll.log
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_bootstrap_native_last_arc_drops_store_before_authority -- --ignored --test-threads=1 --nocapture 2>&1 | tee ownership.log
          grep -q '1 passed; 0 failed' ownership.log
      - name: Strict library lint and source integrity
        run: |
          cargo clippy --locked -p turso_core --tests --features conn_raw_api,bench -- --deny=warnings 2>&1 | tee clippy.log
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-reclaim-stub
          path: '*.log'
