name: Shared statement stack release
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: '1'
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '89a751390ea4c707b32cda7a015d468cccfd3269'
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Exact source and matching workspace build
        run: |
          git rev-parse HEAD HEAD^{tree} | tee source.txt
          rustc -Vv | tee rustc.txt
          git diff 6a602a8075da5b53171450b00e7e05a80da84a7a HEAD --stat | tee source-diff.txt
          cargo build --verbose --locked --all-features 2>&1 | tee build.log
      - name: Uninstrumented regression three times and complete sync suite
        env:
          NEXTEST_PROFILE: ci
          LOCAL_SYNC_SERVER: ../../target/debug/tursodb
          RUST_LOG: ''
        run: |
          for trial in 1 2 3; do
            cargo nextest run --workspace --all-features --locked --no-fail-fast --exclude memory-benchmark -E 'test(=database_sync_engine::tests::deferred_first_contact_converts_wal_replica_to_mvcc_and_applies_base)' --no-tests=fail --failure-output=immediate 2>&1 | tee "exact-$trial.log"
          done
          cargo nextest run --workspace --all-features --locked --no-fail-fast --exclude memory-benchmark -E 'package(turso_sync_engine)' --no-tests=fail --failure-output=immediate 2>&1 | tee sync-suite.log
          python3 - <<'PYCODE'
          import re
          from pathlib import Path
          for path in [*Path('.').glob('exact-*.log'), Path('sync-suite.log')]:
              text=re.sub(r'\x1b\[[0-9;]*m', '', path.read_text())
              assert 'FLAKY' not in text, path
              summaries=[line for line in text.splitlines() if 'Summary [' in line]
              assert len(summaries)==1 and re.search(r'[1-9][0-9]* tests? run:', summaries[0]), summaries
              if path.name.startswith('exact-'):
                  assert '1 test run: 1 passed' in summaries[0], summaries
              print(path.name, summaries[0])
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-shared-stack-release
          path: |
            *.log
            *.txt
            target/nextest/ci/junit.xml
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '89a751390ea4c707b32cda7a015d468cccfd3269'
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-stack-native
          cache-on-failure: true
      - name: Core and SDK ordinary suites
        run: |
          git rev-parse HEAD HEAD^{tree} | tee source.txt
          rustc -Vv | tee rustc.txt
          cargo test --locked -p turso_core -p turso_sdk_kit --lib --features turso_core/bench,turso_core/conn_raw_api,turso_core/fts,turso_core/io_uring 2>&1 | tee core-sdk.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' core-sdk.log
      - name: Actual native shared state ownership
        run: |
          for pair in shared_id_opcode_native_:13 shared_id_lifecycle_native_:8 shared_id_lifecycle_io_native_:2 shared_watermark_io_native_:1 shared_watermark_process_native_:1; do
            selector="${pair%:*}"
            count="${pair#*:}"
            cargo test --locked -p turso_core --lib --features bench,conn_raw_api,fts,io_uring "$selector" -- --ignored --test-threads=1 2>&1 | tee "$selector.log"
            grep -Eq "test result: ok\. $count passed; 0 failed;" "$selector.log"
          done
      - name: Strict core and SDK lint and format
        run: |
          cargo clippy --locked -p turso_core -p turso_sdk_kit --all-targets --features turso_core/bench,turso_core/conn_raw_api,turso_core/fts,turso_core/io_uring -- --deny=warnings 2>&1 | tee clippy.log
          cargo fmt --check
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-shared-stack-release
          path: |
            *.log
            *.txt
