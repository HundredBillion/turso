name: Account-free fork benchmark measurements
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a602a807
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed@6.0.0
      - name: Download previously built benchmark binaries
        uses: actions/download-artifact@v4
        with:
          name: codspeed-benchmarks-stable
          run-id: 42512954346
          github-token: ${{ github.token }}
      - name: Verify benchmark provenance and unpack
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse 6a602a807)"
          echo 'Benchmark binaries: public PR head 57e1589300ee76f4e9b5b550d8729e40d5c91dfe, build run42512954346.'
          echo 'This run validates workflow measurement and artifact handling, not newer engine performance.'
          mkdir -p target
          zstd -q -d --long=31 -c codspeed-benchmarks.tar.zst | tar -xf - -C target
          rm codspeed-benchmarks.tar.zst
      - name: Run real JSON measurements without hosted upload
        uses: CodSpeedHQ/action@v4.17.0
        env:
          CODSPEED_SKIP_UPLOAD: 'true'
        with:
          mode: simulation
          run: cargo +1.88.0 codspeed run --bench json_benchmark
      - name: Require measured profiles
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          profiles = list(Path('/tmp').glob('profile.*.out'))
          measurements = [f for p in profiles for f in p.rglob('*') if f.is_file() and f.suffix in ('.out', '.tgtrace') and f.stat().st_size > 0]
          assert measurements, 'runner produced no nonempty measurement files'
          print('Nonempty measurement files:', len(measurements))
          PYCODE
      - name: Benchmark failures remain failures
        env:
          CODSPEED_SKIP_UPLOAD: 'true'
        run: |
          set +e
          codspeed run --mode simulation -- false > failed-command.log 2>&1
          status=$?
          set -e
          cat failed-command.log
          test "$status" -ne 0
          grep -Eiq 'failed|error|non-zero|exit code' failed-command.log
      - name: Preserve actual profiles
        uses: actions/upload-artifact@v4
        with:
          name: fork-json-measurements
          path: /tmp/profile.*.out/
          if-no-files-found: error
          retention-days: 7
