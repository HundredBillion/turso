name: Shared ID namespace native validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f2f7cfc754acdefac4db2b86a12ad133f47e1afb
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source and native environment
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = f2f7cfc754acdefac4db2b86a12ad133f47e1afb
          test "$(id -u)" -ne 0
          stat -f -c 'workspace filesystem: %T (%t)' .
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
          rustc -Vv | tee rustc.txt
      - name: Export a real marked fixture
        run: |
          mkdir "$RUNNER_TEMP/shared-probe"
          TURSO_SHARED_PROBE_DIR="$RUNNER_TEMP/shared-probe" cargo test --locked -p turso_core --lib --features conn_raw_api shared_runtime_export_fixture_for_release_probe -- --ignored --test-threads=1 --nocapture 2>&1 | tee fixture.log
          grep -q '1 passed; 0 failed' fixture.log
      - name: Production library must reproduce duplicate mapping rejection
        run: |
          set +e
          cargo run --locked -p turso_core --features test_helper --example shared_open_probe -- "$RUNNER_TEMP/shared-probe/shared.db" 67108864 2>&1 | tee production-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'duplicate same-process shared WAL coordination open' production-red.log
      - name: Preserve exact source and expected failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-id-namespace-validation
          path: |
            source.txt
            rustc.txt
            *.log
            *.patch
          retention-days: 14
