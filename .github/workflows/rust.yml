name: Shared ID namespace native validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ffb9a05a5110d2ce0a8a5f1eb90a72125aae026d
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source and native environment
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = ffb9a05a5110d2ce0a8a5f1eb90a72125aae026d
          test "$(id -u)" -ne 0
          stat -f -c 'workspace filesystem: %T (%t)' .
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
          rustc -Vv | tee rustc.txt
      - name: Concrete offline upgrade and interrupted marker recovery
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api mode_transition::ordinary::tests:: -- --test-threads=1 --nocapture 2>&1 | tee offline-green.log
          grep -q '4 passed; 0 failed; 1 ignored' offline-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api marker_recovery_token_ -- --test-threads=1 --nocapture 2>&1 | tee recovery-token.log
          grep -q '5 passed; 0 failed' recovery-token.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_open_native_preserves_base_and_separates_readonly_handles -- --ignored --test-threads=1 --nocapture 2>&1 | tee normal-open.log
          grep -q '1 passed; 0 failed' normal-open.log
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee lint.log
      - name: Preserve exact source and expected failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-id-namespace-validation
          path: |
            source.txt
            rustc.txt
            *.log
            *.patch
          retention-days: 14
