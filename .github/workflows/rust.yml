name: Shared RELEASE cap lifecycle validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 93549f7a3258a59a28271cefea6b049fb9f7c8e1
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 93549f7a3258a59a28271cefea6b049fb9f7c8e1
          rustc -Vv | tee rustc.txt
      - name: Shared RELEASE and COMMIT preservation
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_ -- --test-threads=1 --nocapture 2>&1 | tee shared-green.log
          grep -q '6 passed; 0 failed' shared-green.log
      - name: Savepoint and abandoned-commit regressions
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api savepoint -- --test-threads=1 2>&1 | tee savepoint.log
          cargo test --locked -p turso_core --lib --features conn_raw_api abandoned -- --test-threads=1 2>&1 | tee abandoned.log
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-release-green
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
