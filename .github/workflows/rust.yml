name: Shared constructor checkpoint pause regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-constructor-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b25efbacffb3ff8dd568651fdc64314b2f180d53
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Record exact source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = b25efbacffb3ff8dd568651fdc64314b2f180d53
          rustc -Vv | tee rustc.txt
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
      - name: Guarded constructor honors paused admission
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_connection_native_pause_rejects_connection_before_header_io -- --ignored --test-threads=1 --nocapture 2>&1 | tee pause-red.log
          grep -q '1 passed; 0 failed' pause-red.log
      - name: Preserve exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-constructor-b25-green
          path: |
            source.txt
            rustc.txt
            pause-red.log
