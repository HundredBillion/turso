name: Committed physical WAL recovery GREEN
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  physical-wal-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7b7c4798969766fca0ae66c42dc1e82e29ee584a
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Actual committed physical WAL recovery
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 7b7c4798969766fca0ae66c42dc1e82e29ee584a
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_wal_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee physical-wal-green.log
          grep -q '5 passed; 0 failed' physical-wal-green.log
          python3 - <<'PATCH'
          import re
          text=open('physical-wal-green.log').read()
          roots=set(map(int,re.findall(r'ACK_DATA_ROOT=(\d+)',text)))
          assert len(roots)==1 and min(roots)>1,roots
          root=roots.pop()
          p='core/storage/wal.rs'
          s=open(p).read(); old='                    // sort by frame_id for read locality'
          assert s.count(old)==1
          open(p,'w').write(s.replace(old,f'                    if std::env::var_os("TURSO_RECOVERY_SKIP_PAGE").is_some() {{ to_checkpoint.retain(|(page, _)| *page != {root}); }}\n'+old))
          p='core/mvcc/database/shared_checkpoint_recovery_wal_tests.rs'
          s=open(p).read(); a=s.index('fn checkpoint_recovery_wal_native_restores_committed_image_without_completion_or_admission')
          old='            let mut mirror = selected.begin_intent_mirror().unwrap();'
          before,body=s[:a],s[a:]; assert body.count(old)>=1
          body=body.replace(old,'            std::env::set_var("TURSO_RECOVERY_SKIP_PAGE", "1");\n'+old,1)
          open(p,'w').write(before+body)
          PATCH
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_wal_native_restores_committed_image_without_completion_or_admission -- --ignored --test-threads=1 --nocapture > required-data-page-red.log 2>&1
          code=$?
          set -e
          git restore core/storage/wal.rs core/mvcc/database/shared_checkpoint_recovery_wal_tests.rs
          cat required-data-page-red.log
          test "$code" -ne 0
          grep -q '0 passed; 1 failed' required-data-page-red.log
          grep -q 'PHYSICAL_RECOVERY_UNADMITTED_OUTPUT' required-data-page-red.log
          grep -q 'recovered data row differs from acknowledged value' required-data-page-red.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_wal_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee physical-wal-restored-green.log
          grep -q '5 passed; 0 failed' physical-wal-restored-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api physical_wal_recovery_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee physical-owner-regression-green.log
          grep -q '8 passed; 0 failed' physical-owner-regression-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_intent_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee intent-regression-green.log
          grep -q '9 passed; 0 failed' intent-regression-green.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-physical-wal-green
          path: |
            source.txt
            *.log
