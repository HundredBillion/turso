name: Shared downgrade preparation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
defaults:
  run:
    shell: bash
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7c6161b8682e1daa7b0dfcbfb04556542825481
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = b7c6161b8682e1daa7b0dfcbfb04556542825481
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Exact-layout removal control and restored live marker
        run: |
          file=core/mvcc/mode_transition/downgrade_marker.rs
          cp "$file" /tmp/downgrade-marker.rs
          trap 'cp /tmp/downgrade-marker.rs "$file"' EXIT
          python3 - <<'PYCONTROL'
          from pathlib import Path
          p = Path('core/mvcc/mode_transition/downgrade_marker.rs')
          text = p.read_text()
          needle = '    proof\n        .intent\n        .installed_source()?\n        .validate_physical_layout(&header, proof.main_file().size()?)?;\n'
          assert text.count(needle) == 1
          p.write_text(text.replace(needle, ''))
          PYCONTROL
          git diff > layout-control.diff
          set +e
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_marker_native_rejects_changed_installed_extent -- --ignored --test-threads=1 --nocapture 2>&1 | tee layout-control-red.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" = 101
          grep -q '^test result: FAILED. 0 passed; 1 failed;' layout-control-red.log
          grep -q 'changed installed extent must reject before marker publication' layout-control-red.log
          cp /tmp/downgrade-marker.rs "$file"
          trap - EXIT
          git diff --exit-code
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_marker_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee marker-restored.log
          grep -q '^test result: ok. 3 passed; 0 failed;' marker-restored.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-downgrade-preparation
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
            *status.txt
          retention-days: 14
