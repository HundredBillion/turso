name: Precommit physical WAL genuine crash RED
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  physical-wal-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d0f7dd2215834070ada89cc32e93d66072f52f6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Actual committed physical WAL recovery
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 9d0f7dd2215834070ada89cc32e93d66072f52f6
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_wal_precommit_native_genuine_crashes_preserve_source_main -- --ignored --test-threads=1 --nocapture 2>&1 | tee precommit-prerequisites.log
          grep -q '1 passed; 0 failed' precommit-prerequisites.log
          test "$(grep -c PRECOMMIT_SOURCE_UNCHANGED precommit-prerequisites.log)" = 10
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_wal_precommit_native_recovers_source_without_discarding_logical_ack -- --ignored --test-threads=1 --nocapture > precommit-recovery-red.log 2>&1
          code=$?
          set -e
          cat precommit-recovery-red.log
          test "$code" -ne 0
          grep -q '0 passed; 1 failed' precommit-recovery-red.log
          grep -q 'nonempty physical WAL lacks a supported committed image' precommit-recovery-red.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-physical-wal-green
          path: |
            source.txt
            *.log
