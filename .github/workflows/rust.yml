name: Native public shared checkpoint entry
on:
  workflow_dispatch:
    inputs:
      engine:
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.engine }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Verify native source
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          test "$(git rev-parse HEAD)" = "$ENGINE"
          test "$(id -u)" -ne 0
          stat -f -c '%T %t' . /tmp
      - name: Public API and SQL checkpoints
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_entry_native_ -- --ignored --test-threads=1 2>&1 | tee entry.log
          grep -q '3 passed; 0 failed' entry.log
      - name: Existing checkpoint installation and readiness
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_ready_native_ -- --ignored --test-threads=1 2>&1 | tee ready.log
          grep -q '4 passed; 0 failed' ready.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_install_native_ -- --ignored --test-threads=1 2>&1 | tee install.log
          grep -q '6 passed; 0 failed' install.log
      - name: Strict core lint and format
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p turso_core --all-targets --features conn_raw_api -- -D warnings 2>&1 | tee lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-entry-evidence
          path: '*.log'
