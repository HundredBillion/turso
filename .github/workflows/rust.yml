name: Shared ID namespace native validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 84aa97f1539e2b05d310dcbf4e63de6a0fadf153
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source and native environment
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 84aa97f1539e2b05d310dcbf4e63de6a0fadf153
          test "$(id -u)" -ne 0
          stat -f -c 'workspace filesystem: %T (%t)' .
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
          rustc -Vv | tee rustc.txt
      - name: Finalize IDs with real completion evidence
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api id_checkpoint_finalize_native -- --ignored --test-threads=1 --nocapture 2>&1 | tee finalize-green.log
          grep -q '3 passed; 0 failed' finalize-green.log
      - name: Early old-bank reclamation must fail recovery
        run: |
          python3 -c 'from pathlib import Path; p=Path("core/mvcc/shared_ids/checkpoint_finalize.rs"); s=p.read_text(); old="match self.step {"; assert s.count(old)==1; p.write_text(s.replace(old,"match match self.step { 0 => 4, 1 => 5, 2 => 0, 3 => 1, 4 => 2, 5 => 3, other => other } {"))'
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api id_checkpoint_finalize_native_preserves_target_at_each_failure_boundary -- --ignored --test-threads=1 --nocapture 2>&1 | tee early-reclaim-red.log
          status=${PIPESTATUS[0]}
          set -e
          git checkout -- core/mvcc/shared_ids/checkpoint_finalize.rs
          test "$status" -ne 0
          grep -q '0 passed; 1 failed' early-reclaim-red.log
          cargo test --locked -p turso_core --lib --features conn_raw_api id_checkpoint_finalize_native -- --ignored --test-threads=1 --nocapture 2>&1 | tee finalize-restored.log
          grep -q '3 passed; 0 failed' finalize-restored.log
          git diff --exit-code
      - name: Committed ID facts and cancellation
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_oracle_native -- --ignored --test-threads=1 --nocapture 2>&1 | tee facts.log
          grep -q '2 passed; 0 failed' facts.log
      - name: Shared checkpoint physical materialization retains acknowledged log
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee materialize.log
          grep -q '2 passed; 0 failed' materialize.log
      - name: Integrated offline operations and staging cleanup
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api mvcc::mode_transition -- --test-threads=1 --nocapture 2>&1 | tee offline.log
          grep -Eq '[1-9][0-9]* passed; 0 failed' offline.log
      - name: Oracle provenance and independent transaction lifecycle
        run: |
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_oracle_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee oracle.log
          grep -q '2 passed; 0 failed' oracle.log
          cargo test --locked -p turso_core --lib --features conn_raw_api read_pinned_file -- --test-threads=1 --nocapture 2>&1 | tee pins.log
          grep -q '2 passed; 0 failed' pins.log
      - name: Epoch identity and native reservation process recovery
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api commit_manifest:: -- --test-threads=1 --nocapture 2>&1 | tee manifests.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_authority:: -- --test-threads=1 --nocapture 2>&1 | tee authority.log
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_ids:: -- --test-threads=1 --nocapture 2>&1 | tee ids.log
          grep -q 'native_id_reservations_survive_death_compaction_and_reopen ... ok' ids.log
      - name: Native opening SQL commits and admission after reconciliation
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_open_native -- --ignored --test-threads=1 --nocapture 2>&1 | tee opening.log
          grep -q '2 passed; 0 failed' opening.log
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_commit_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee commits.log
          grep -q '2 passed; 0 failed' commits.log
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_ -- --test-threads=1 --nocapture 2>&1 | tee vdbe.log
          grep -q '6 passed; 0 failed' vdbe.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_refresh_ -- --test-threads=1 --nocapture 2>&1 | tee refresh.log
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee lint.log
      - name: Preserve exact source and expected failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-id-namespace-validation
          path: |
            source.txt
            rustc.txt
            *.log
            *.patch
          retention-days: 14
