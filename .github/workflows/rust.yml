name: Private SOURCE construction genuine missing behavior
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  physical-wal-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c6c8f194969c181a292535ebada21025b75fc580
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Actual committed physical WAL recovery
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = c6c8f194969c181a292535ebada21025b75fc580
          uname -a | tee environment.txt
          rustc --version | tee -a environment.txt
          stat -f -c '%T %t' . | tee -a environment.txt
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_factory_native_private_connection_stays_unadmitted_with_private_wal -- --ignored --test-threads=1 --nocapture 2>&1 | tee source-factory-missing.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -q 'test result: FAILED. 0 passed; 1 failed' source-factory-missing.log
          grep -q 'private source construction is not implemented' source-factory-missing.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-physical-wal-green
          path: |
            *.txt
            *.log
