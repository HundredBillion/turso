name: JSON postings experiment validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_LIB_RELEASE_PANIC: unwind
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Source and environment
        run: |
          mkdir -p posting-results
          git rev-parse HEAD > posting-results/revision.txt
          rustc -Vv > posting-results/toolchain.txt
          lscpu > posting-results/cpu.txt
      - name: Validate transaction and recovery behavior
        run: cargo test --locked -p turso_benches --example json_posting_probe --profile lib-release > posting-results/lifecycle.log 2>&1
      - name: Build optimized probe
        run: |
          cargo build --locked -p turso_benches --example json_posting_probe --profile lib-release > posting-results/build.log 2>&1
          sha256sum target/lib-release/examples/json_posting_probe > posting-results/binary.sha256
      - name: Alternate scan, expression and postings measurements
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          from pathlib import Path
          output = Path('posting-results')
          orders = [('scan','expression','postings'), ('expression','postings','scan'), ('postings','scan','expression')]
          for rows in [1000,10000]:
              for repeat, order in enumerate(orders,1):
                  for mode in order:
                      label=f'{rows}-{repeat}-{mode}'
                      print(label, flush=True)
                      env=dict(os.environ, POSTING_ROWS=str(rows), POSTING_SAMPLES='1000', POSTING_MODE=mode)
                      with (output/f'{label}.csv').open('w') as stdout, (output/f'{label}.log').open('w') as stderr:
                          subprocess.run(['/usr/bin/time','-v','target/lib-release/examples/json_posting_probe'], env=env, stdout=stdout, stderr=stderr, check=True)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: json-postings-results
          path: posting-results/
          retention-days: 14
