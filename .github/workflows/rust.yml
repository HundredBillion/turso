name: SDK inherited OFD control
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 94a20d73f13dd76e8ac33ad674b5efc27a04a2f6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Focused ownership
        run: |
          git rev-parse HEAD | tee source.txt
          rustc -Vv | tee rustc.txt
          cargo test --locked -p turso_sdk_kit --lib codec_reopen_observes_inherited_ofd_until_child_exec -- --nocapture 2>&1 | tee focused.log
      - name: Full SDK ownership
        if: always()
        run: |
          cargo test --locked -p turso_sdk_kit --lib -- --nocapture 2>&1 | tee sdk.log
          for repeat in $(seq 1 20); do
            cargo test --locked -p turso_sdk_kit --lib page_codec_is_applied_to_sdk_connections -- --nocapture 2>&1 | tee "codec-repeat-$repeat.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-inherited-ofd-control
          path: |
            *.log
            source.txt
            rustc.txt
