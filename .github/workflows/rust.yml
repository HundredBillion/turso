name: Shared sequence watermark acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1c61e2306b8c37ff71728e19819ba572338e2d74
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 1c61e2306b8c37ff71728e19819ba572338e2d74
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Native watermark boundary and live claims
        run: |
          set -o pipefail
          timeout 1200 cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_opcode_native_watermark_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee watermark.log
          grep -q '3 passed; 0 failed' watermark.log
      - name: Strict library lint
        run: |
          set -o pipefail
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-watermark
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
