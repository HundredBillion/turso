name: Prepare peer schema counterexample
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d95c591da225314272eb6401f5ae4f00fb8a3ae
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact source and native filesystem
        run: |
          test "$(git rev-parse HEAD)" = "0d95c591da225314272eb6401f5ae4f00fb8a3ae"
          test "$(id -u)" -ne 0
          stat -f -c '%T %t' . /tmp
      - name: Verified existing peer preparation prerequisite
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_stale_prepare_native_peer_sequence_ddl -- --ignored --test-threads=1 2>&1 | tee prerequisite.log
          grep -q '1 passed; 0 failed' prerequisite.log
      - name: Preparation without an intervening statement must expose stale schema
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_prepare_native_ -- --ignored --test-threads=1 2>&1 | tee prepare-red.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -q '0 passed; 2 failed' prepare-red.log
          grep -q 'prepare used the schema from before the peer committed' prepare-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: id-cleanup-capacity
          path: '*.log'
