name: Shared commit publication and cap reset regression
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  vdbe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 844f31e848689c3088334421a0ff9676d95d2586
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source and native environment
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 844f31e848689c3088334421a0ff9676d95d2586
          test "$(id -u)" -ne 0
          stat -f -c 'workspace filesystem: %T (%t)' .
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
          rustc -Vv | tee rustc.txt
      - name: Native shared commit publication
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_commit_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee commit-native.log
          grep -q '2 passed; 0 failed' commit-native.log
      - name: Explicit COMMIT cap reset regression must fail before hook
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_explicit_commit_cap_busy -- --test-threads=1 --nocapture 2>&1 | tee cap-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q '0 passed; 1 failed' cap-red.log
          grep -q 'cap Busy discarded explicit transaction' cap-red.log
      - name: Preserve exact source and controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-commit-cap-red
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
