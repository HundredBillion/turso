name: Source Store cap GREEN and retained-Store lifetime RED
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  physical-wal-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29124b98cf043376b70f4be114b33f40a1ad30fc
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Actual committed physical WAL recovery
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 29124b98cf043376b70f4be114b33f40a1ad30fc
          uname -a | tee environment.txt
          rustc --version | tee -a environment.txt
          stat -f -c '%T %t' . | tee -a environment.txt
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_bootstrap_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee merged-bootstrap-green.log
          grep -q '14 passed; 0 failed' merged-bootstrap-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_wal_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee merged-committed-green.log
          grep -q '5 passed; 0 failed' merged-committed-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_wal_precommit_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee merged-precommit-green.log
          grep -q '4 passed; 0 failed' merged-precommit-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_store_native_ -- --ignored --skip retained_store_clone --test-threads=1 --nocapture 2>&1 | tee owned-store-green.log
          grep -q '5 passed; 0 failed' owned-store-green.log
          python3 - <<'PATCH'
          p='core/mvcc/database/shared_checkpoint_intent_store.rs'
          s=open(p).read()
          old='    authority_owner: Arc<PublicationLease>,\n'; assert s.count(old)==1; s=s.replace(old,'')
          old='            authority_owner,\n'; assert s.count(old)==1; s=s.replace(old,'')
          old='            || !Arc::ptr_eq(\n                &self.authority_owner,\n                &self.lease.upgrade().ok_or(LimboError::Busy)?,\n            )\n'
          assert s.count(old)==1; s=s.replace(old,'')
          open(p,'w').write(s)
          PATCH
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_store_native_callee_error_drops_store_before_native_authority -- --ignored --test-threads=1 --nocapture > owner-lease-red.log 2>&1
          code=$?
          set -e
          git restore core/mvcc/database/shared_checkpoint_intent_store.rs
          cat owner-lease-red.log
          test "$code" -ne 0
          grep -q '0 passed; 1 failed' owner-lease-red.log
          grep -q 'original guard error released native authority before Store destruction' owner-lease-red.log
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_store_native_ -- --ignored --skip retained_store_clone --test-threads=1 --nocapture 2>&1 | tee owned-store-restored-green.log
          grep -q '5 passed; 0 failed' owned-store-restored-green.log
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_store_native_retained_store_clone_keeps_native_authority -- --ignored --test-threads=1 --nocapture > actual-store-clone-red.log 2>&1
          code=$?
          set -e
          cat actual-store-clone-red.log
          test "$code" -ne 0
          grep -q '0 passed; 1 failed' actual-store-clone-red.log
          grep -q 'owner drop released native authority while a real Store clone survived' actual-store-clone-red.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-physical-wal-green
          path: |
            *.txt
            *.log
