name: Shared downgrade preparation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
defaults:
  run:
    shell: bash
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a21e099189c4a79b538a95947165e465d07e3ec
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 3a21e099189c4a79b538a95947165e465d07e3ec
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Fresh terminal controls including actual process death
        run: |
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_resume_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee resume.log
          grep -q '^test result: ok. 4 passed; 0 failed;' resume.log
      - name: Genuine installed extent expected RED
        run: |
          set +e
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_extent_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee extent-red.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" = 101
          grep -q '^test result: FAILED. 0 passed; 1 failed;' extent-red.log
          grep -q 'fresh downgrade must accept the unchanged genuine installed physical extent' extent-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-downgrade-preparation
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
            *status.txt
            *summary.txt
          retention-days: 14
