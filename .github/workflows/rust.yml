name: Recovered checkpoint logical reclamation validation
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  recovered-finalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d05a253dcf898ebf5017c25943db7816bef2f16c
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact native source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = d05a253dcf898ebf5017c25943db7816bef2f16c
          test "$(id -u)" -ne 0
          stat -f -c 'filesystem: %T (%t)' /tmp
          rustc -Vv
      - name: Existing recovered finalization prerequisites
        run: |
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_finalize_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee finalized.log
          grep -q '7 passed; 0 failed' finalized.log
      - name: Recovered logical reclamation and ownership
        run: |
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_reclaim_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee reclaim.log
          grep -q '9 passed; 0 failed' reclaim.log
      - name: Existing Store reservation bypass must fail
        run: |
          python3 - <<'PYCONTROL'
          p='core/mvcc/database/shared_store_claim.rs'
          s=open(p).read()
          old='        if !matches!(*claim, StoreClaimState::Free) {\n            return Err(LimboError::Busy);\n        }\n'
          assert s.count(old)==2
          head,tail=s.rsplit(old,1)
          open(p,'w').write(head+tail)
          PYCONTROL
          set +e
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_reclaim_native_rejects_preexisting_store_before_mutation -- --ignored --test-threads=1 --nocapture 2>&1 | tee claim-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'reclamation accepted a runtime with a preexisting Store' claim-red.log
          grep -q '0 passed; 1 failed' claim-red.log
          git checkout -- core/mvcc/database/shared_checkpoint_recovery_reclaim.rs core/mvcc/database/shared_store_claim.rs
      - name: Final logical retirement bypass must fail
        run: |
          python3 - <<'PYCONTROL'
          p='core/mvcc/database/shared_checkpoint_recovery_reclaim.rs'
          s=open(p).read()
          old='                    if !guard.io_retired() {\n                        return Ok(IOResult::IO(IOCompletions(guard.retirement_completion())));\n                    }\n'
          assert s.count(old)==2
          head,tail=s.rsplit(old,1)
          open(p,'w').write(head+tail)
          PYCONTROL
          set +e
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_reclaim_native_log_waits_for_physical_retirement -- --ignored --test-threads=1 --nocapture 2>&1 | tee retirement-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'logical reclamation escaped before physical retirement' retirement-red.log
          grep -q '0 passed; 1 failed' retirement-red.log
          git checkout -- core/mvcc/database/shared_checkpoint_recovery_reclaim.rs core/mvcc/database/shared_store_claim.rs
      - name: Actual append cache adoption bypass must fail
        run: |
          python3 - <<'PYCONTROL'
          p='core/mvcc/database/shared_checkpoint_recovery_reclaim.rs'
          s=open(p).read()
          a=s.index('                    self.runtime.storage.adopt_shared_prefix(')
          b=s.index('                    let logical:',a)
          open(p,'w').write(s[:a]+s[b:])
          PYCONTROL
          set +e
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_reclaim_native_log_waits_for_physical_retirement -- --ignored --test-threads=1 --nocapture 2>&1 | tee append-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'recovered logical append state is not empty' append-red.log
          grep -q '0 passed; 1 failed' append-red.log
          git checkout -- core/mvcc/database/shared_checkpoint_recovery_reclaim.rs core/mvcc/database/shared_store_claim.rs
      - name: Restored reclaim and witness finalization
        run: |
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_reclaim_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee reclaim-restored.log
          grep -q '9 passed; 0 failed' reclaim-restored.log
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_finalize_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee finalization-restored.log
          grep -q '7 passed; 0 failed' finalization-restored.log
          timeout 180 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_confirmation_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee witness.log
          grep -q '8 passed; 0 failed' witness.log
      - name: ID authority and full MVCC coverage
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api mvcc::shared_ids:: -- --test-threads=1 2>&1 | tee ids.log
          grep -Eq 'test result: ok. [1-9][0-9]* passed; 0 failed' ids.log
          cargo test --locked -p turso_core --lib --features conn_raw_api mvcc::shared_authority::tests:: -- --test-threads=1 2>&1 | tee authority.log
          grep -Eq 'test result: ok. [1-9][0-9]* passed; 0 failed' authority.log
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api mvcc:: -- --test-threads=1 2>&1 | tee mvcc.log
          grep -Eq 'test result: ok. [1-9][0-9]* passed; 0 failed' mvcc.log
      - name: Strict library lint and source integrity
        run: |
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- --deny=warnings 2>&1 | tee clippy.log
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-reclaim-stub
          path: '*.log'
