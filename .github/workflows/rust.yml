name: Canonical JSON regression diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build same-path controls and compare targeted cases
        run: python3 scripts/diagnose_json_canonical.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-json-results
          path: canonical-results/
          retention-days: 14
