name: Shared ID namespace native validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dfb36d8713401bc4d47d2412b5e82aa0a79a3cbd
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source and native environment
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = dfb36d8713401bc4d47d2412b5e82aa0a79a3cbd
          test "$(id -u)" -ne 0
          stat -f -c 'workspace filesystem: %T (%t)' .
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
          rustc -Vv | tee rustc.txt
      - name: Root-map preparation and allocation failure
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_generation_reload_ -- --test-threads=1 --nocapture 2>&1 | tee preparation.log
          grep -q '3 passed; 0 failed' preparation.log
      - name: Reproduce missing proof-bound installation
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_generation_reload_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee reload-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'generation reload installation is not implemented' reload-red.log
          grep -q '0 passed; 1 failed' reload-red.log
      - name: Preserve exact source and expected failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-id-namespace-validation
          path: |
            source.txt
            rustc.txt
            *.log
            *.patch
          retention-days: 14
