name: Live sequence descriptor native validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 149f5562eed349e8ff79a414c9df52ae1e71c4e2
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = "$(git rev-parse 149f5562eed349e8ff79a414c9df52ae1e71c4e2)"
          test "$(id -u)" -ne 0
          stat -f -c '%T %t' . /tmp
      - name: Complete-frame descriptor regressions
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api peer_import_sequence_frame_ -- --test-threads=1 --nocapture 2>&1 | tee descriptor.log
          grep -q '4 passed; 0 failed' descriptor.log
      - name: Previously failing independent peer sequence preparation
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_stale_prepare_native_peer_sequence_ddl -- --ignored --test-threads=1 --nocapture 2>&1 | tee peer-sequence.log
          grep -q '1 passed; 0 failed' peer-sequence.log
      - name: Shared ID opcode compatibility
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_opcode_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee id-opcodes.log
          grep -q '9 passed; 0 failed' id-opcodes.log
      - name: Complete MVCC database and strict library lint
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api mvcc::database:: -- --test-threads=2 2>&1 | tee mvcc.log
          grep -Eq '[1-9][0-9]* passed; 0 failed' mvcc.log
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-coordinator-native
          path: |
            source.txt
            *.log
