name: Prepared marker recovery token validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9a8183223231ae1851a36c2ef7dba5b652099757
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 9a8183223231ae1851a36c2ef7dba5b652099757
          rustc -Vv | tee rustc.txt
      - name: Prepared marker token must fail before implementation
        run: |
          set +e
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api marker_recovery_token_retains -- --test-threads=1 --nocapture 2>&1 | tee token-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q '0 passed; 1 failed' token-red.log
          grep -q 'prepared recovery validation is not implemented' token-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marker-token-red
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
