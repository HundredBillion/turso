name: Shared pager Windows compilation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-pager-check:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cde1b85918f86c0248b80518f8a1fb55586290bc
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pager-generation-windows-188
      - name: Record exact source and platform
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = cde1b85918f86c0248b80518f8a1fb55586290bc
          rustc -Vv | tee rustc.txt
      - name: Windows shared-refresh typecheck
        run: |
          cargo check --locked -p turso_core --lib --features conn_raw_api 2>&1 | tee windows-check.log
          cargo fmt --all -- --check
          git diff --exit-code
      - name: Removing the Unix guard must reproduce the Windows field error
        run: |
          trap 'git restore core/mvcc/database/shared_refresh.rs' EXIT
          python -c 'from pathlib import Path; p=Path("core/mvcc/database/shared_refresh.rs"); s=p.read_text(); old="        #[cfg(all(host_shared_wal, unix))]\n"; assert s.count(old)==1; p.write_text(s.replace(old,""))'
          set +e
          cargo check --locked -p turso_core --lib --features conn_raw_api 2>&1 | tee windows-cfg-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'E0609' windows-cfg-red.log
          grep -q 'shared_runtime' windows-cfg-red.log
          git restore core/mvcc/database/shared_refresh.rs
      - name: Restored Windows source must typecheck
        run: |
          git diff --exit-code
          cargo check --locked -p turso_core --lib --features conn_raw_api 2>&1 | tee windows-restored.log
      - name: Preserve exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pager-generation-cde1-windows
          path: |
            source.txt
            rustc.txt
            windows-check.log
            windows-cfg-red.log
            windows-restored.log
