name: Additional shared ID opcode acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e332ad964527f2696ed0a852fd09fafb378ed0b
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 5e332ad964527f2696ed0a852fd09fafb378ed0b
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: AUTOINCREMENT updated key and replacement
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api --no-run
          for selector in shared_id_opcode_native_autoincrement_ shared_id_opcode_native_updated_key_ shared_id_opcode_native_replace_; do
            timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api "$selector" -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$selector.log"
            grep -q '1 passed; 0 failed' "$selector.log"
          done
      - name: Strict library lint
        run: |
          set -o pipefail
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-id-additional-acceptance
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
