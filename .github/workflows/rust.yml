name: Shared downgrade preparation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
defaults:
  run:
    shell: bash
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0135a79872ef1ad101b640988c7106b463bb341f
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 0135a79872ef1ad101b640988c7106b463bb341f
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Genuine installed checkpoint downgrade preparation
        run: |
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_prepare_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee downgrade-native.log
          grep -q '^test result: ok. 6 passed; 0 failed;' downgrade-native.log
      - name: Retain ready and installer behavior
        run: |
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_ready_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee ready-native.log
          grep -q '^test result: ok. 4 passed; 0 failed;' ready-native.log
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_install_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee install-native.log
          grep -q '^test result: ok. 6 passed; 0 failed;' install-native.log
      - name: Existing manifest protocol and terminal admission fence
        run: |
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api commit_manifest -- --test-threads=1 --nocapture 2>&1 | tee manifest.log
          grep -q '^test result: ok. 30 passed; 0 failed;' manifest.log
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api commit_manifest_downgrade_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee fence-native.log
          grep -q '^test result: ok. 1 passed; 0 failed;' fence-native.log
      - name: Strict library lint and formatting
        run: |
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- --deny=warnings 2>&1 | tee clippy.log
          cargo fmt --all --check
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-downgrade-preparation
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
            *status.txt
          retention-days: 14
