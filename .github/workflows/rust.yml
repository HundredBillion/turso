name: macOS sync stack counterexample
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: '1'
jobs:
  stack:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 57e1589300ee76f4e9b5b550d8729e40d5c91dfe
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Matching workspace build
        run: |
          git rev-parse HEAD HEAD^{tree} | tee source.txt
          test "$(git rev-parse HEAD^{tree})" = 9eac9697b47bff664d84af86687fbe236fa4bb51
          rustc -Vv | tee rustc.txt
          cargo build --verbose --locked --all-features 2>&1 | tee build.log
      - name: Exact nextest counterexample
        env:
          NEXTEST_PROFILE: ci
          LOCAL_SYNC_SERVER: ../../target/debug/tursodb
          RUST_LOG: ''
        run: |
          set +e
          cargo nextest run --workspace --all-features --locked --no-fail-fast --exclude memory-benchmark -E 'test(=database_sync_engine::tests::deferred_first_contact_converts_wal_replica_to_mvcc_and_applies_base)' --no-tests=fail --failure-output=final 2>&1 | tee baseline.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > status.txt
          test "$status" -eq 100
          grep -q 'has overflowed its stack' baseline.log
          grep -q '1 test run:.*0 passed.*1 failed' baseline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-sync-stack-baseline
          path: |
            *.log
            *.txt
            target/nextest/ci/junit.xml
