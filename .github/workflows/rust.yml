name: Idle shared Store generation baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  idle-generation-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9459876e3abcfc382511d7b2a34fb63d4a810d51
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Record exact source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 9459876e3abcfc382511d7b2a34fb63d4a810d51
          rustc -Vv | tee rustc.txt
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
      - name: Actual checkpoint and later commits must expose stale idle Store
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_idle_generation_native_reloads_after_checkpoint_and_later_commits -- --ignored --test-threads=1 --nocapture 2>&1 | tee idle-generation-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q '0 passed; 1 failed' idle-generation-red.log
          grep -q 'idle old-generation process failed to refresh a nonempty newer generation' idle-generation-red.log
          grep -q 'shared replay boundary changed incompatibly' idle-generation-red.log
          git diff --exit-code
      - name: Preserve exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-generation-9459-red
          path: |
            source.txt
            rustc.txt
            idle-generation-red.log
