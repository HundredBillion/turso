name: Dense IVF experiment validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "3"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build optimized experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dense-results
          git rev-parse HEAD > dense-results/revision.txt
          rustc -Vv > dense-results/toolchain.txt
          lscpu > dense-results/cpu.txt
          cargo test -p core_tester --no-default-features --features experimental_dense_ivf,test_helper --test integration_tests --no-run --locked --message-format=json > dense-results/build.jsonl 2> dense-results/build.log
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          binaries = [v['executable'] for line in Path('dense-results/build.jsonl').read_text().splitlines() if (v := json.loads(line)).get('reason') == 'compiler-artifact' and v.get('executable') and v['target']['name'] == 'integration_tests']
          assert len(binaries) == 1, binaries
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('TEST_BINARY=' + binaries[0] + '\n')
          PYCODE
          sha256sum "$(python3 -c 'import json; from pathlib import Path; print(next(v["executable"] for l in Path("dense-results/build.jsonl").read_text().splitlines() if (v:=json.loads(l)).get("executable") and v["target"]["name"]=="integration_tests"))')" > dense-results/binary.sha256
      - name: Validate transaction and recovery behavior
        run: '"$TEST_BINARY" dense_ivf --nocapture --test-threads=1 > dense-results/lifecycle.log 2>&1'
      - name: Measure recall and latency at 100k rows
        env:
          DENSE_IVF_ROWS: "100000"
          DENSE_IVF_QUERIES: "100"
        run: /usr/bin/time -v "$TEST_BINARY" dense_ivf_recall_probe --ignored --nocapture --test-threads=1 > dense-results/measurement.log 2> dense-results/resources.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dense-ivf-results
          path: dense-results/
          retention-days: 14
