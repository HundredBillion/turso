name: Shared pager Windows compilation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-pager-check:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cde1b85918f86c0248b80518f8a1fb55586290bc
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pager-generation-windows-188
      - name: Record exact source and platform
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = cde1b85918f86c0248b80518f8a1fb55586290bc
          rustc -Vv | tee rustc.txt
      - name: Windows shared-refresh typecheck
        run: |
          cargo check --locked -p turso_core --lib --features conn_raw_api 2>&1 | tee windows-check.log
          cargo fmt --all -- --check
          git diff --exit-code
      - name: Preserve exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pager-generation-cde1-windows
          path: |
            source.txt
            rustc.txt
            windows-check.log
