name: Shared synchronous prepare retirement validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  prepare-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a3e9f78d0bd1debef6b467775450e61a6af9463
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact native source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 6a3e9f78d0bd1debef6b467775450e61a6af9463
          test "$(id -u)" -ne 0
          stat -f -c 'filesystem: %T (%t)' /tmp
          rustc -Vv
      - name: Checkpoint pause excludes idle root prepare
        run: |
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_prepare_native_idle_root_respects_checkpoint_pause -- --ignored --test-threads=1 --nocapture 2>&1 | tee pause.log
          grep -q '1 passed; 0 failed' pause.log
      - name: Manifest and logical physical retirement
        run: |
          timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api shared_prepare_io_native_no_result_until_manifest_and_logical_backend_retire -- --ignored --test-threads=1 --nocapture 2>&1 | tee retirement-green.log
          grep -q '1 passed; 0 failed' retirement-green.log
      - name: Immediate peer schema import
        run: |
          timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api shared_prepare_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee prepare-green.log
          grep -q '3 passed; 0 failed' prepare-green.log
      - name: Central replay cancellation and read pins
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_refresh -- --test-threads=1 2>&1 | tee refresh.log
          grep -q '6 passed; 0 failed' refresh.log
          cargo test --locked -p turso_core --lib --features conn_raw_api mvcc::read_pinned_file -- --test-threads=1 2>&1 | tee pins.log
          grep -q '2 passed; 0 failed' pins.log
      - name: Watermark cancellation sibling and shared metadata
        run: |
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_watermark_io_native_reset_drop_resume_retains_physical_reads -- --ignored --test-threads=1 --nocapture 2>&1 | tee watermark-io.log
          grep -q '1 passed; 0 failed' watermark-io.log
          cargo test --locked -p turso_core --lib --features conn_raw_api mvcc:: -- --test-threads=1 2>&1 | tee mvcc.log
          grep -q '0 failed' mvcc.log
      - name: Strict library lint
        run: |
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee lint.log
      - name: Source integrity
        run: |
          cargo fmt --all --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-prepare-retirement
          path: |
            source.txt
            *.log
