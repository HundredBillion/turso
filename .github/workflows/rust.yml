name: Verified checkpoint and claim lifecycle integration
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  coordinator:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07cff3dc54f351a60a57262b4144fbdad66e361e
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact native source
        run: |
          test "$(git rev-parse HEAD)" = "07cff3dc54f351a60a57262b4144fbdad66e361e"
          test "$(id -u)" -ne 0
          stat -f -c '%T %t' . /tmp
      - name: Final checkpoint readiness
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_ready_native_ -- --ignored --test-threads=1 2>&1 | tee group-0.log
          grep -q '4 passed; 0 failed' group-0.log
      - name: Checkpoint installation and retirement
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api shared_checkpoint_install_native_ -- --ignored --test-threads=1 2>&1 | tee group-1.log
          grep -q '6 passed; 0 failed' group-1.log
      - name: Connection construction and pager ownership
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api shared_connection_native_ -- --ignored --test-threads=1 2>&1 | tee group-2.log
          grep -q '6 passed; 0 failed' group-2.log
      - name: Completed pager certification
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api shared_pager_generation_native_ -- --ignored --test-threads=1 2>&1 | tee group-3.log
          grep -q '1 passed; 0 failed' group-3.log
      - name: Scoped claim lifecycle
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_lifecycle_native_ -- --ignored --test-threads=1 2>&1 | tee group-4.log
          grep -q '8 passed; 0 failed' group-4.log
      - name: Actual mutation completion retirement
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_lifecycle_io_native_ -- --ignored --test-threads=1 2>&1 | tee group-5.log
          grep -q '2 passed; 0 failed' group-5.log
      - name: Global row and sequence allocation
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_opcode_native_ -- --ignored --test-threads=1 2>&1 | tee group-6.log
          grep -q '13 passed; 0 failed' group-6.log
      - name: Idle prepare schema and read lifetime
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_prepare_native_ -- --ignored --test-threads=1 2>&1 | tee prepare.log
          grep -q '3 passed; 0 failed' prepare.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_prepare_io_native_ -- --ignored --test-threads=1 2>&1 | tee prepare-io.log
          grep -q '1 passed; 0 failed' prepare-io.log
      - name: Independent oracle pager layout after reset
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_oracle_pager_uses_retained_identity_and_independent_read_state -- --ignored --test-threads=1 2>&1 | tee oracle-layout.log
          grep -q '1 passed; 0 failed' oracle-layout.log
      - name: Watermark readers and durable peer state
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_watermark_ -- --ignored --skip shared_watermark_process_child --skip shared_prepare_io_native_ --test-threads=1 2>&1 | tee watermark.log
          grep -q '3 passed; 0 failed' watermark.log
      - name: Fresh completed recovery
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_ -- --ignored --test-threads=1 2>&1 | tee checkpoint_recovery_.log
          grep -Eq "[1-9][0-9]* passed; 0 failed" checkpoint_recovery_.log
      - name: Idle generation reload
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api shared_idle_generation_native_ -- --ignored --skip shared_idle_generation_native_child --test-threads=1 2>&1 | tee shared_idle_generation_native_.log
          grep -Eq "[1-9][0-9]* passed; 0 failed" shared_idle_generation_native_.log
      - name: Current prefix ownership
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api shared_current_prefix_native_ -- --ignored --test-threads=1 2>&1 | tee shared_current_prefix_native_.log
          grep -Eq "[1-9][0-9]* passed; 0 failed" shared_current_prefix_native_.log
      - name: Current physical base
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api current_base_native_ -- --ignored --test-threads=1 2>&1 | tee current_base_native_.log
          grep -Eq "[1-9][0-9]* passed; 0 failed" current_base_native_.log
      - name: Private generation install
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api current_local_install_native_ -- --ignored --test-threads=1 2>&1 | tee current_local_install_native_.log
          grep -Eq "[1-9][0-9]* passed; 0 failed" current_local_install_native_.log
      - name: Schema and worker acceptance
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api shared_schema_publication_native_ -- --ignored --test-threads=1 2>&1 | tee shared_schema_publication_native_.log
          grep -Eq "[1-9][0-9]* passed; 0 failed" shared_schema_publication_native_.log
      - name: Independent worker acceptance
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api shared_worker_native_ -- --ignored --test-threads=1 2>&1 | tee workers.log
          grep -q "5 passed; 0 failed" workers.log
      - name: Full ordinary core and strict lint
        run: |
          timeout 600s cargo test --locked -p turso_core --lib --features conn_raw_api -- --test-threads=2 2>&1 | tee core.log
          grep -Eq '[1-9][0-9]* passed; 0 failed' core.log
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee lint.log
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-lifecycle-integration
          path: '*.log'
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07cff3dc54f351a60a57262b4144fbdad66e361e
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
      - name: Check ordinary Windows compatibility
        run: cargo check --locked -p turso_core --lib --features conn_raw_api,bench
