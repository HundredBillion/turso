name: Shared downgrade preparation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
defaults:
  run:
    shell: bash
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9264a7717
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse --short=9 HEAD)" = 9264a7717
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Manifest alias provenance expected RED
        run: |
          set +e
          timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api shared_downgrade_prepare_native_rejects_manifest_backend_substitution -- --ignored --test-threads=1 --nocapture 2>&1 | tee alias-red.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" = 101
          grep -q '^test result: FAILED. 0 passed; 1 failed;' alias-red.log
          grep -q 'same bytes from another manifest backend must not certify offline publication' alias-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-downgrade-preparation
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
            *status.txt
          retention-days: 14

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9264a7717
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Check portable manifest compilation
        run: cargo check --locked -p turso_core --lib --features conn_raw_api,bench 2>&1 | tee windows-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downgrade-windows-check
          path: windows-check.log
          retention-days: 14
