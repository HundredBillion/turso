name: macOS sync crash backtrace
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: '1'
jobs:
  stack:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fd98deec6f1fdd5e91043c3b03ea6adfc86d01f3
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Matching workspace build
        run: |
          git rev-parse HEAD HEAD^{tree} | tee source.txt
          rustc -Vv | tee rustc.txt
          cargo build --verbose --locked --all-features 2>&1 | tee build.log
      - name: Exact nextest counterexample
        env:
          NEXTEST_PROFILE: ci
          LOCAL_SYNC_SERVER: ../../target/debug/tursodb
          RUST_LOG: ''
        run: |
          set +e
          cargo nextest run --workspace --all-features --locked --no-fail-fast --exclude memory-benchmark -E 'test(=database_sync_engine::tests::deferred_first_contact_converts_wal_replica_to_mvcc_and_applies_base)' --no-tests=fail --failure-output=immediate --success-output=immediate 2>&1 | tee baseline.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > status.txt
          test "$status" -eq 100 -o "$status" -eq 0
          python3 - <<'PYCODE'
          import re
          from pathlib import Path
          Path('baseline-plain.log').write_text(re.sub(r'\x1b\[[0-9;]*m', '', Path('baseline.log').read_text()))
          PYCODE
          grep -Eq '1 tests? run:' baseline-plain.log
      - name: Native stack trace without changing stack limits
        if: always()
        run: |
          cargo test --workspace --all-features --locked --exclude memory-benchmark --no-run --message-format=json > test-metadata.json 2> test-metadata.log
          python3 - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          rows=[json.loads(line) for line in Path('test-metadata.json').read_text().splitlines()]
          binaries=[r['executable'] for r in rows if r.get('reason')=='compiler-artifact' and r.get('target',{}).get('name')=='turso_sync_engine' and r.get('profile',{}).get('test') and r.get('executable')]
          assert len(binaries)==1,binaries
          Path('test-binary.txt').write_text(binaries[0])
          cmd=['lldb','--batch','-o','run','-k','thread backtrace all -c 120','-k','register read sp fp','-k','disassemble --frame','--',binaries[0],'--exact','database_sync_engine::tests::deferred_first_contact_converts_wal_replica_to_mvcc_and_applies_base','--nocapture']
          try:
              result=subprocess.run(cmd,capture_output=True,text=True,timeout=90)
              Path('lldb.log').write_text(result.stdout+'\n'+result.stderr)
              Path('lldb-status.txt').write_text(str(result.returncode))
          except subprocess.TimeoutExpired as error:
              Path('lldb.log').write_bytes((error.stdout or b'')+(error.stderr or b'')+b'\nLLDB timed out')
              raise
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-sync-stack-phases
          path: |
            *.log
            *.txt
            target/nextest/ci/junit.xml
