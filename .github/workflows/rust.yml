name: Shared ID savepoint regression
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 202f692b6bb1b5e98a5ba675d9a2cb5361bffda2
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 202f692b6bb1b5e98a5ba675d9a2cb5361bffda2
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Build exact native tests
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api --no-run 2>&1 | tee build.log
      - name: Physical claim cancellation
        run: |
          set -o pipefail
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_lifecycle_io_native_mutations_retire_before_reset_acknowledges -- --ignored --test-threads=1 --nocapture 2>&1 | tee mutation-retirement.log
          grep -q '1 passed; 0 failed' mutation-retirement.log
      - name: Autonomous sequence physical cancellation
        if: always()
        run: |
          set -o pipefail
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_lifecycle_io_native_sequence_commit_preserves_saved_outer -- --ignored --test-threads=1 --nocapture 2>&1 | tee sequence-retirement.log
          grep -q '1 passed; 0 failed' sequence-retirement.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-id-physical-cancellation
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
          retention-days: 14
