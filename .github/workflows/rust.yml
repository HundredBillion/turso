name: Provisional independent shared PDO workers
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e1e329716081d8718688606bfe4b51bb87ed0ba3
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Exact native source and supervisor checks
        run: |
          test "$(git rev-parse HEAD)" = e1e329716081d8718688606bfe4b51bb87ed0ba3
          test "$(id -u)" -ne 0
          stat -f -c '%T %t' . /tmp
          python3 -m unittest discover -s bindings/c/tests/php_workers -p 'test_*.py'
          python3 -m pip install --break-system-packages ruff==0.9.6
          ruff check bindings/c/tests/php_workers
          ruff format --check bindings/c/tests/php_workers
      - name: Install actual PHP PDO
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3
          php --version
          php -l bindings/c/tests/php_workers/worker.php
      - name: Stock SQLite controls
        run: |
          python3 bindings/c/tests/php_workers/run.py --profile sqlite-wal-control --api pdo --output pdo-results/sqlite-control 2>&1 | tee stock.log
          set +e
          python3 bindings/c/tests/php_workers/run.py --profile sqlite-shared-negative-control --api pdo --output pdo-results/sqlite-negative > sqlite-negative.log 2>&1
          status=$?
          set -e
          cat sqlite-negative.log
          test "$status" -eq 78
          grep -q '"status": "unsupported"' sqlite-negative.log
      - name: Build and attest tested library and CLI
        run: |
          cargo build --locked -p turso_sqlite3 -p turso_cli
          sha256sum target/debug/libturso_sqlite3.so target/debug/tursodb | tee binary-hashes.log
          mkdir "$RUNNER_TEMP/shared-pdo-loader"
          ln -s "$PWD/target/debug/libturso_sqlite3.so" "$RUNNER_TEMP/shared-pdo-loader/libsqlite3.so.0"
      - name: Ordinary Turso control
        run: |
          LD_LIBRARY_PATH="$RUNNER_TEMP/shared-pdo-loader:$PWD/target/debug" python3 bindings/c/tests/php_workers/run.py --profile turso-single-worker-control --api pdo --library "$PWD/target/debug/libturso_sqlite3.so" --output pdo-results/turso-control 2>&1 | tee ordinary.log
      - name: Independent shared PDO preflight
        run: |
          LD_LIBRARY_PATH="$RUNNER_TEMP/shared-pdo-loader:$PWD/target/debug" python3 bindings/c/tests/php_workers/run.py --profile shared-acceptance --api pdo --library "$PWD/target/debug/libturso_sqlite3.so" --shared-admin-cli "$PWD/target/debug/tursodb" --output pdo-results/shared 2>&1 | tee shared.log
          grep -q '"acceptance": true' shared.log
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-pdo-worker-preflight
          path: |
            *.log
            pdo-results/**
