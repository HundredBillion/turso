name: Shared ID savepoint regression
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2fb0d40f040dcd5c0c340880070d198c6634ff66
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 2fb0d40f040dcd5c0c340880070d198c6634ff66
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Build exact native tests
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api --no-run 2>&1 | tee build.log
      - name: Native ID lifecycle and physical retirement
        run: |
          set -o pipefail
          for spec in 'shared_id_lifecycle_native_:8' 'shared_id_lifecycle_io_native_:2' 'shared_id_opcode_native_:13' 'shared_watermark_identity_native_:1' 'shared_watermark_io_native_:1' 'shared_watermark_process_native_:1' 'shared_id_stale_prepare_native_:1'; do
            selector=${spec%:*}
            count=${spec#*:}
            timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api "$selector" -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$selector.log"
            grep -q "$count passed; 0 failed" "$selector.log"
          done
      - name: Cap preservation and shared ID policy
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_ -- --test-threads=1 2>&1 | tee vdbe.log
          grep -q '6 passed; 0 failed' vdbe.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_ids:: -- --test-threads=2 2>&1 | tee id-policy-all.log
          grep -q '0 failed' id-policy-all.log
          ! grep -q '0 passed; 0 failed' id-policy-all.log
          cargo test --locked -p turso_core --lib --features conn_raw_api peer_import_sequence_frame_ 2>&1 | tee peer-descriptors.log
          grep -q '4 passed; 0 failed' peer-descriptors.log
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee clippy.log
      - name: Commit preflight causal control and restored source
        run: |
          set -o pipefail
          python3 - <<'CONTROL'
          from pathlib import Path
          path = Path('core/mvcc/shared_commit.rs')
          source = path.read_text()
          start = source.index('                        if let Err(error) = loaded.guard()?.check_append_size_with_metadata(')
          end = source.index('                        let next = ManifestRecord::new(', start)
          path.write_text(source[:start] + '                        // Validation-only: bypass commit capacity rejection.\n' + source[end:])
          CONTROL
          git diff -- core/mvcc/shared_commit.rs > commit-preflight-control.diff
          set +e
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_explicit_commit_cap_busy_retains_transaction_on_reset_or_drop -- --test-threads=1 --nocapture 2>&1 | tee commit-preflight-red.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" = 101
          grep -q '0 passed; 1 failed' commit-preflight-red.log
          grep -Eq 'commit.run_with_row_callback|cap rejection modified published bytes|cap Busy discarded' commit-preflight-red.log
          git restore core/mvcc/shared_commit.rs
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_ -- --test-threads=1 2>&1 | tee restored-vdbe.log
          grep -q '6 passed; 0 failed' restored-vdbe.log
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-id-lifecycle-budget-union
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
          retention-days: 14
