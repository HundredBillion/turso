name: Shared ID savepoint regression
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9fc58f691cc2c3de28bc6bcee4d0eadb96d2878a
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 9fc58f691cc2c3de28bc6bcee4d0eadb96d2878a
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Build exact native tests
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api --no-run 2>&1 | tee build.log
      - name: Expected scoped rollback regression
        run: |
          set -o pipefail
          set +e
          timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_lifecycle_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee lifecycle-red.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" = 101
          grep -q '0 passed; 1 failed' lifecycle-red.log
          grep -q 'ROLLBACK TO acknowledged but retained scoped ID claims' lifecycle-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-id-lifecycle-red
          path: |
            source.txt
            rustc.txt
            *.log
            *.diff
          retention-days: 14
