name: Private shared ID opcode regression
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  ids:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa9d721b8e7724bc1232e618bbd0305bae0af8ab
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = fa9d721b8e7724bc1232e618bbd0305bae0af8ab
          rustc -Vv | tee rustc.txt
      - name: Native ID opcode integration
        run: |
          set -o pipefail
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_opcode_native -- --ignored --test-threads=1 --nocapture 2>&1 | tee ids-green.log
          grep -q '6 passed; 0 failed' ids-green.log
      - name: Preserve separate stale prepare regression
        run: |
          set +e
          timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_stale_prepare_native -- --ignored --test-threads=1 --nocapture 2>&1 | tee stale-prepare-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'idle peer did not import committed sequence DDL before prepare' stale-prepare-red.log
          grep -q '0 passed; 1 failed' stale-prepare-red.log
      - name: Combined budget and lifecycle integration
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee vdbe-union.log
          grep -q '6 passed; 0 failed' vdbe-union.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_physical_connection_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee physical.log
          grep -q '1 passed; 0 failed' physical.log
          for selector in statement_lifecycle rowid sequence; do
            cargo test --locked -p turso_core --lib --features conn_raw_api "$selector" -- --test-threads=1 2>&1 | tee "$selector.log"
            grep -Eq '[1-9][0-9]* passed; 0 failed' "$selector.log"
          done
      - name: Strict library lint
        run: |
          set -o pipefail
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-id-opcode-regression
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
