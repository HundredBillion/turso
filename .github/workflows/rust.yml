name: Prepared marker recovery token validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c5af231ca98586b79c69bda82277f07faabc968
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse --short=9 HEAD)" = 9c5af231c
          rustc -Vv | tee rustc.txt
      - name: Fresh publication orphan regression must fail
        run: |
          set +e
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api staging_cleanup_fresh -- --test-threads=1 --nocapture 2>&1 | tee cleanup-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q '0 passed; 1 failed' cleanup-red.log
          grep -q 'owned staging sidecar remained after publication' cleanup-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-cleanup-red
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
