name: Shared sequence watermark counterexample
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 715c4917b6ac985fbc84429cfdee4984e971ab51
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 715c4917b6ac985fbc84429cfdee4984e971ab51
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Expected watermark counterexample
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api --no-run
          set +e
          timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api shared_id_opcode_native_watermark_tracks_live_peer_and_committed_boundary -- --ignored --test-threads=1 --nocapture 2>&1 | tee watermark-red.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 101
          grep -q '0 passed; 1 failed' watermark-red.log
          grep -q 'requires a global live-claim reader' watermark-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-watermark-red
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
