name: Shared downgrade preparation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
defaults:
  run:
    shell: bash
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fda7b28bec7314b6129220bacddd1c430a838cbd
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = fda7b28bec7314b6129220bacddd1c430a838cbd
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Inventory real ordinary ownership failures and SDK independently
        run: |
          failed=0
          for selector in 'mvcc::database::tests::' page_codec test_shm_; do
            label=$(printf '%s' "$selector" | tr ':/' '__')
            set +e
            timeout 600 cargo test --locked -p turso_core --lib --features conn_raw_api,bench "$selector" -- --test-threads=2 > "$label.log" 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$label-status.txt"
            tail -100 "$label.log"
            if test "$code" -ne 0; then failed=1; fi
          done
          set +e
          timeout 600 cargo test --locked -p turso_sdk_kit --lib -- --test-threads=2 > sdk.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > sdk-status.txt
          tail -100 sdk.log
          if test "$code" -ne 0; then failed=1; fi
          python3 - <<'PYCOUNTS'
          import re
          from pathlib import Path
          for file in [Path('mvcc__database__tests__.log'), Path('page_codec.log'), Path('test_shm_.log'), Path('sdk.log')]:
              lines = [line for line in file.read_text().splitlines() if line.startswith('test result:')]
              assert lines, file
              match = re.search(r'(\d+) passed; (\d+) failed;', lines[-1])
              assert match and sum(map(int, match.groups())) > 0, (file, lines[-1])
          PYCOUNTS
          test "$failed" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-downgrade-preparation
          path: |
            source.txt
            rustc.txt
            *.log
            test-clippy.json
            empty-harness.json
            engine-control.json
            *.diff
            *status.txt
            *summary.txt
          retention-days: 14
