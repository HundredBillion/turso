name: Shared commit cap reset preservation validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  vdbe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b8e78c330c71401b5a58266119ac1c05e2db9907
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record source and native environment
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = b8e78c330c71401b5a58266119ac1c05e2db9907
          test "$(id -u)" -ne 0
          stat -f -c 'workspace filesystem: %T (%t)' .
          stat -f -c 'temporary filesystem: %T (%t)' /tmp
          rustc -Vv | tee rustc.txt
      - name: Shared cap preservation and admission
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_vdbe_ -- --test-threads=1 --nocapture 2>&1 | tee cap-green.log
          grep -q '5 passed; 0 failed' cap-green.log
      - name: Native snapshot publication and recovery
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_commit_native_preserves_snapshots -- --ignored --test-threads=1 --nocapture 2>&1 | tee snapshot.log
          grep -q '1 passed; 0 failed' snapshot.log
      - name: Ordinary abandoned commit cleanup
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api abandoned -- --test-threads=1 2>&1 | tee abandoned.log
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench -- -D warnings 2>&1 | tee clippy.log
      - name: Preserve exact source and controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-commit-cap-green
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
