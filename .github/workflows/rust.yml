name: Fresh recovery selection sealed endpoint
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  physical-wal-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4532b92040e8a5c7565d718d26da93e12e32f79d
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Actual committed physical WAL recovery
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 4532b92040e8a5c7565d718d26da93e12e32f79d
          uname -a | tee environment.txt
          rustc --version | tee -a environment.txt
          stat -f -c '%T %t' . | tee -a environment.txt
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_entry_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee fresh-selection-green.log
          grep -q '5 passed; 0 failed' fresh-selection-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_io_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee selection-retirement-green.log
          grep -q '2 passed; 0 failed' selection-retirement-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_bootstrap_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee normal-bootstrap-green.log
          grep -q '14 passed; 0 failed' normal-bootstrap-green.log
          cargo test --locked -p turso_core --lib --features conn_raw_api intent_source_store_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee source-store-green.log
          grep -q '6 passed; 0 failed' source-store-green.log
          python3 - <<'PATCH'
          p='core/mvcc/database/shared_checkpoint_recovery.rs'
          s=open(p).read(); old='            || !pause.belongs_to(&runtime.gate)\n'; assert s.count(old)==1
          open(p,'w').write(s.replace(old,''))
          PATCH
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_entry_native_fresh_selection_rejects_foreign_pause -- --ignored --test-threads=1 --nocapture > foreign-pause-red.log 2>&1
          code=$?
          set -e
          git restore core/mvcc/database/shared_checkpoint_recovery.rs
          cat foreign-pause-red.log
          test "$code" -ne 0
          grep -q '0 passed; 1 failed' foreign-pause-red.log
          grep -q 'foreign pause authorized fresh recovery' foreign-pause-red.log
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_entry_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee fresh-selection-restored-green.log
          grep -q '5 passed; 0 failed' fresh-selection-restored-green.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committed-physical-wal-green
          path: |
            *.txt
            *.log
