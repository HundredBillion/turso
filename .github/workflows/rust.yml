name: Prepared marker recovery token validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d67a9f87d
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse --short=9 HEAD)" = d67a9f87d
          rustc -Vv | tee rustc.txt
      - name: Prepared marker token native proof checks
        run: |
          set -o pipefail
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api marker_recovery_token -- --test-threads=1 --nocapture 2>&1 | tee token-green.log
          grep -q '5 passed; 0 failed' token-green.log
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api mapped_shared_wal_coordination_snapshot_waits -- --test-threads=1 --nocapture 2>&1 | tee snapshot.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marker-token-green
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
