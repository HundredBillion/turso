name: Shared downgrade preparation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
defaults:
  run:
    shell: bash
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60f1cf7fd95e7225f61c314caee8f322d1fcd313
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 60f1cf7fd95e7225f61c314caee8f322d1fcd313
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Exact Linux test lint diagnostics
        run: |
          cargo clippy --locked -p turso_core --lib --tests --features conn_raw_api,bench,io_uring --message-format=json -- -D warnings > test-clippy.json 2> test-clippy.log
      - name: Strict production library lint
        if: always()
        run: |
          cargo clippy --locked -p turso_core --lib --features conn_raw_api,bench,io_uring -- -D warnings 2>&1 | tee library-clippy.log
          cargo fmt --all --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-downgrade-preparation
          path: |
            source.txt
            rustc.txt
            *.log
            test-clippy.json
            *.diff
            *status.txt
            *summary.txt
          retention-days: 14
