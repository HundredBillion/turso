name: Shared open recovery baseline
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  shared-open-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 097256765512384e519412b923ce5eddc8b33f10
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Actual baseline source
        run: |
          test "$(git rev-parse HEAD)" = 097256765512384e519412b923ce5eddc8b33f10
          test "$(id -u)" -ne 0
          rustc -Vv
      - name: Healthy live readers and unacknowledged tails
        run: |
          for filter in shared_open_recovery_native_healthy_open_keeps_live_reader shared_open_recovery_native_empty_prefix_ignores_unacknowledged_tail; do
            timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api "$filter" -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$filter.log"
            grep -q '1 passed; 0 failed' "$filter.log"
          done
      - name: Selector probe and existing transport lifetime
        run: |
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api shared_open_selector_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee selector.log
          grep -q '3 passed; 0 failed' selector.log
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_io_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee existing-io.log
          grep -q '2 passed; 0 failed' existing-io.log
      - name: Normal pending checkpoint public open now works
        run: |
          timeout 240 cargo test --locked -p turso_core --lib --features conn_raw_api shared_open_recovery_native_completed_pending_ids_opens -- --ignored --test-threads=1 --nocapture 2>&1 | tee pending-ids.log
          grep -q '1 passed; 0 failed' pending-ids.log
      - name: Fresh selection dependency and existing Ready
        run: |
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_entry_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee fresh-entry.log
          grep -q '5 passed; 0 failed' fresh-entry.log
          timeout 300 cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_bootstrap_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee ready.log
          grep -q '16 passed; 0 failed' ready.log
      - name: Strict test lint and unchanged source
        run: |
          cargo clippy --locked -p turso_core --tests --features conn_raw_api,bench -- --deny=warnings 2>&1 | tee clippy.log
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-shared-open-baseline
          path: '*.log'
