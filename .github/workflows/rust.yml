name: Interrupted checkpoint intent fixture RED
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  intent-native-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4b12adbcb07acf5bd2354147973627bba69f76f6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recovery-native-143ccda
      - name: Genuine coordinator crash fixture prerequisite
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = 4b12adbcb07acf5bd2354147973627bba69f76f6
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_intent_native_crash_fixtures_keep_acknowledged_source -- --ignored --test-threads=1 --nocapture 2>&1 | tee crash-fixture-green.log
          grep -q '1 passed; 0 failed' crash-fixture-green.log
      - name: Missing intent mirror must fail behaviorally
        run: |
          set -euo pipefail
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_intent_native_mirrors_actual_crashed_selection -- --ignored --test-threads=1 --nocapture > intent-mirror-red.log 2>&1
          code=$?
          set -e
          cat intent-mirror-red.log
          test "$code" -ne 0
          grep -q '0 passed; 1 failed' intent-mirror-red.log
          grep -q 'interrupted checkpoint intent mirroring is not implemented' intent-mirror-red.log
          cargo clippy --locked -p turso_core --lib --features bench,conn_raw_api -- -D warnings
          cargo fmt --all -- --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interrupted-intent-fixture-red-4b12adbcb
          path: |
            source.txt
            *.log
