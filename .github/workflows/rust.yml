name: Shared provisional domain probes
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af4d6bf740ae4a83987a4b8df51b6e5cfffa187f
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = af4d6bf740ae4a83987a4b8df51b6e5cfffa187f
          rustc -Vv | tee rustc.txt
          stat -f -c '%T %t' . /tmp
      - name: Provisional table and sequence probes
        run: |
          set -o pipefail
          cargo test --locked -p turso_core --lib --features conn_raw_api --no-run
          for selector in shared_id_opcode_native_provisional_table_ shared_id_opcode_native_provisional_sequence_; do
            set +e
            timeout 120 cargo test --locked -p turso_core --lib --features conn_raw_api "$selector" -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$selector.log"
            result=${PIPESTATUS[0]}
            set -e
            echo "$result" > "$selector.exit.log"
            test "$result" -eq 0 -o "$result" -eq 101
            grep -Eq '(1 passed; 0 failed|0 passed; 1 failed)' "$selector.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-provisional-probes
          path: |
            source.txt
            rustc.txt
            *.log
          retention-days: 14
