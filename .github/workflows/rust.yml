name: Recovery physical inspection expected RED
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26ebfc4cad628f0c21cbd0fd5654b4384f362d1a
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fork-mvcc-authority
          cache-on-failure: true
      - name: Record exact source and filesystem
        run: |
          git rev-parse HEAD | tee source.txt
          test "$(git rev-parse HEAD)" = "$(git rev-parse 26ebfc4cad628f0c21cbd0fd5654b4384f362d1a)"
          test "$(id -u)" -ne 0
          stat -f -c '%T %t' . /tmp
      - name: Verified recovery and physical-collector prerequisites
        run: |
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_entry_native_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee entry.log
          grep -q '3 passed; 0 failed' entry.log
          cargo test --locked -p turso_core --lib --features conn_raw_api shared_bootstrap::tests:: -- --test-threads=1 --nocapture 2>&1 | tee collector.log
          grep -q '4 passed; 0 failed' collector.log
      - name: Exact missing physical inspection
        run: |
          set +e
          cargo test --locked -p turso_core --lib --features conn_raw_api checkpoint_recovery_physical_native_ -- --ignored --test-threads=1 --nocapture > physical-red.log 2>&1
          result=$?
          set -e
          cat physical-red.log
          test "$result" -ne 0
          grep -q 'checkpoint recovery physical inspection is not implemented' physical-red.log
          grep -q '0 passed; 1 failed' physical-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-coordinator-native
          path: |
            source.txt
            *.log
